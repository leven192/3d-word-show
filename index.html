<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- NAIGU EXPO V1.5: fogFar=120 exposure=0.5 no-wireframe -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>耐锢科技线上展厅</title>
  <!-- 正式 Logo favicon（logo2.png 生成，版本号强制刷新缓存） -->
  <link rel="icon" type="image/png" href="favicon.png?v=20260823" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260823" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #10131a;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #app { position: fixed; inset: 0; }

    /* 双层画布：底层=全景低模场景，顶层=详情高精度模型（透明） */
    #app canvas { position: absolute; inset: 0; display: block; }
    #low-canvas  { z-index: 1; pointer-events: none; transition: filter .7s ease, transform .7s ease; }
    #high-canvas { z-index: 2; pointer-events: auto; }
    /* 背景虚化：详情模式下底层全景变模糊，聚焦特写模型（深蓝灰背景保持原亮度） */
    #app.blur #low-canvas {
      filter: blur(12px) brightness(.9);
      transform: scale(1.06);
    }

    /* ========== 详情参数面板（左下角，避开右上角 lil-gui 控制面板） ========== */
    #detail-panel {
      position: fixed; z-index: 12;
      left: 16px; bottom: 16px; width: 300px;
      background: rgba(16,20,30,.88); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
      padding: 18px; color: #e8ecf4;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      transform: translateX(-24px); opacity: 0; pointer-events: none;
      transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s;
    }
    #detail-panel.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
    /* 收起状态：面板滑出屏幕（模型不被遮挡） */
    #detail-panel.collapsed { transform: translateX(-130%); opacity: 0; pointer-events: none; }
    #detail-panel .dp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #detail-panel .dp-name { font-size: 19px; font-weight: 700; flex: 1; min-width: 0; line-height: 1.35; word-break: break-all; }
    #dp-collapse {
      background: rgba(255,255,255,.08); color: #aab4c8; border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; line-height: 1;
      flex: none; transition: background .2s, color .2s;
    }
    #dp-collapse:hover { background: rgba(255,255,255,.16); color: #fff; }
    #detail-panel .dp-desc  { color: rgba(232,236,244,.6); font-size: 12px; margin: 6px 0 14px; line-height: 1.6; }
    #detail-panel table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    #detail-panel td { font-size: 12.5px; padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,.07); }
    #detail-panel td:first-child { color: rgba(232,236,244,.5); width: 38%; }
    #detail-panel td:last-child { text-align: right; color: #9fc6ff; }
    #detail-panel .dp-status { font-size: 11.5px; margin-bottom: 14px; min-height: 16px; }
    #detail-panel .dp-status.ok  { color: #5fd08a; }
    #detail-panel .dp-status.err { color: #ff7a7a; }
    #detail-panel .dp-status.loading { color: #ffc46b; }
    /* 收起后的迷你标签条（点击展开，位于左下角与面板同位置） */
    #dp-mini {
      position: fixed; left: 16px; bottom: 16px; z-index: 12;
      background: rgba(61,108,255,.9); color: #fff;
      border-radius: 18px; padding: 8px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      transition: background .2s, transform .15s;
    }
    #dp-mini:hover { background: #2f58d6; }
    #dp-mini:active { transform: scale(.95); }
    #dp-mini.hidden { display: none; }
    #back-btn {
      width: 100%; padding: 10px; border: none; border-radius: 9px; cursor: pointer;
      background: linear-gradient(90deg, #2e5bff, #5a3dff); color: #fff; font-size: 14px; font-weight: 600;
      letter-spacing: 2px; transition: filter .2s, transform .1s;
    }
    #back-btn:hover { filter: brightness(1.15); }
    #back-btn:active { transform: scale(.97); }
    @media (max-width: 768px) {
      #detail-panel { top: auto; bottom: 12px; right: 10px; left: 10px; width: auto; transform: translateY(16px); }
      #detail-panel.show { transform: translateY(0); }
      #detail-panel.collapsed { transform: translateY(130%); }
      #dp-mini { top: auto; left: 50%; bottom: 12px; transform: translateX(-50%); }
    }
    /* 详情模式：侧栏滑出隐藏（面板放左下角不被遮挡），分享按钮隐藏 */
    #device-panel { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
    body.in-detail #device-panel { transform: translateX(-100%); }
    body.in-detail #share-btn { opacity: 0; pointer-events: none; }

    /* ========== 常驻「返回大厅」按钮（详情模式显示，不随面板折叠） ========== */
    #lobby-btn {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-70px);
      z-index: 20; padding: 9px 24px; border: 1px solid rgba(255,255,255,.22); border-radius: 22px;
      background: rgba(20,26,40,.85); backdrop-filter: blur(8px);
      color: #fff; font-size: 13.5px; font-weight: 600; letter-spacing: 3px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,.4); transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s, background .2s;
      opacity: 0; pointer-events: none;
    }
    #lobby-btn:hover { background: rgba(46,91,255,.92); }
    #lobby-btn:active { transform: translateX(-50%) translateY(0) scale(.96); }
    body.in-detail #lobby-btn { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    @media (max-width: 768px) {
      body.in-detail #device-panel { transform: translateY(100%); }
      /* 手机端：返回大厅固定在左上角（右上角为控制面板，两区互不重叠） */
      #lobby-btn { left: 12px; transform: translateX(-12px) translateY(-70px); }
      #lobby-btn:hover { background: rgba(46,91,255,.92); }
      #lobby-btn:active { transform: translateX(-12px) translateY(0) scale(.96); }
      body.in-detail #lobby-btn { transform: translateX(0) translateY(0); }
      /* 控制面板保持 lil-gui 默认右上角位置，不做竖放/收起覆盖（避免内容异常） */
    }

    /* ========== 设备列表（桌面左侧栏 / 手机底部横条） ========== */
    #device-panel {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
      width: 210px;
      background: rgba(14,18,26,.8); backdrop-filter: blur(8px);
      border-right: 1px solid rgba(255,255,255,.08);
      display: flex; flex-direction: column;
    }
    #device-panel h3 { color: #c9d2e0; font-size: 14px; font-weight: 600; padding: 14px 14px 10px; }
    /* 品牌（左上角：正式 Logo 图片 + 公司名） */
    #brand {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 14px 4px;
      height: 44px;                      /* 与侧栏标题行高一致，垂直居中 */
      box-sizing: content-box;
    }
    .logo-img { height: 26px; width: auto; flex: none; }   /* 正式 Logo 图片 */
    .logo-text {
      color: #2b2b2b; font-size: 15px; font-weight: 700;        /* 深灰黑粗体 */
      font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
      letter-spacing: 1px; white-space: nowrap;
    }
    @media (max-width: 768px) { #brand { display: none; } }
    #device-list { flex: 1; overflow-y: auto; padding: 0 10px 14px; }
    .device-tile {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
      border-radius: 9px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .device-tile:hover { background: rgba(255,255,255,.09); }
    .device-tile.active { border-color: #3d6cff; background: rgba(61,108,255,.15); }
    .device-tile .dname { color: #e4e9f2; font-size: 12.5px; font-weight: 600; }
    .device-tile .dnum  { color: rgba(228,233,242,.4); font-size: 10.5px; margin-top: 2px; }
    @media (max-width: 768px) {
      #device-panel {
        top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: 88px;
        border-right: none; border-top: 1px solid rgba(255,255,255,.08);
      }
      #device-panel h3 { display: none; }
      #device-list { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; overflow-y: hidden; }
      .device-tile { flex: 0 0 auto; min-width: 72px; max-width: 132px; margin-bottom: 0; padding: 6px; text-align: center; }
      .device-tile .dname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    }

    #share-btn {
      position: fixed; right: 14px; bottom: 14px; z-index: 15; pointer-events: auto;
      background: rgba(43,48,59,.85); color: #e8eaf0; border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px; padding: 7px 14px; cursor: pointer; font-size: 12px;
    }
    #share-btn:hover { background: #3a4150; }
    @media (max-width: 768px) { #share-btn { bottom: 96px; } }

    /* 分享面板（链接 + 二维码，微信扫码打开） */
    #share-panel {
      position: fixed; right: 14px; bottom: 52px; z-index: 16;
      width: 240px;
      background: rgba(16,20,30,.94); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
      padding: 14px; color: #e8ecf4;
      box-shadow: 0 10px 34px rgba(0,0,0,.5);
      opacity: 0; transform: translateY(10px); pointer-events: none;
      transition: opacity .3s, transform .3s;
    }
    #share-panel.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #share-panel .sp-head { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    #share-panel .sp-url-row { display: flex; gap: 6px; margin-bottom: 12px; }
    #share-panel #share-url {
      flex: 1; min-width: 0; background: rgba(255,255,255,.07); color: #cfe0ff;
      border: 1px solid rgba(255,255,255,.12); border-radius: 6px;
      padding: 6px 8px; font-size: 11px; outline: none;
    }
    #share-panel #share-copy {
      background: #3d6cff; color: #fff; border: none; border-radius: 6px;
      padding: 6px 10px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    #share-panel #share-copy:hover { background: #2f58d6; }
    #share-panel .sp-qr-wrap { display: flex; justify-content: center; margin-bottom: 8px; }
    #share-panel #share-qr { background: #fff; border-radius: 8px; width: 180px; height: 180px; }
    #share-panel #share-note {
      color: rgba(232,236,244,.6); font-size: 11px; line-height: 1.6; text-align: center;
    }
    @media (max-width: 768px) { #share-panel { bottom: 132px; right: 10px; } }

    /* ========== 加载遮罩（进度条；不透明，切换时避免闪烁） ========== */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 30;
      background: #10131a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      transition: opacity .35s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.15); border-top-color: #4da3ff;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: #e8eaf0; font-size: 14px; }
    .progress-wrap { width: 240px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #4da3ff, #7c6bff); transition: width .2s; }
    #progress-pct { color: #9fc6ff; font-size: 14px; font-weight: 700; letter-spacing: 1px; min-width: 52px; text-align: center; }
    #loading-overlay.error .spinner { border-top-color: #ff6b6b; }
    #loading-overlay.error #loading-text { color: #ff6b6b; }

    /* ========== 详情内高模加载进度条（顶部细条，不遮模型画面） ========== */
    #hi-progress {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      z-index: 25; width: min(300px, 70vw);
      background: rgba(16,20,30,.82); border: 1px solid rgba(255,255,255,.14);
      border-radius: 20px; padding: 6px 14px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      transition: opacity .3s;
    }
    #hi-progress.hidden { opacity: 0; pointer-events: none; }
    #hi-bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
    #hi-bar::after { content: ''; display: block; height: 100%; width: var(--w, 0%); background: linear-gradient(90deg,#4da3ff,#7c6bff); transition: width .15s; }
    #hi-pct { color: #9fc6ff; font-size: 12px; font-weight: 700; min-width: 34px; text-align: right; }

    .lg { z-index: 5 !important; }
  </style>
  <!-- 兼容性检测（所有浏览器都会执行，早于 module 脚本）：
       新版微信（Chromium 内核）支持 WebGL/ES module → 直接显示 3D；
       仅当内核不支持（老微信/无 WebGL）时显示引导层 -->
  <script>
    (function () {
      try {
        var isWeChat = /MicroMessenger/i.test(navigator.userAgent);
        var supportsModules = 'noModule' in document.createElement('script');
        var cv = document.createElement('canvas');
        var supportsWebGL = !!(window.WebGLRenderingContext && (cv.getContext('webgl') || cv.getContext('experimental-webgl')));
        function addLayer(innerHTML) {
          var layer = document.createElement('div');
          layer.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#f5f7fa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:"Microsoft YaHei",sans-serif;text-align:center;padding:24px;';
          layer.innerHTML = innerHTML;
          var mount = function () { (document.body || document.documentElement).appendChild(layer); };
          if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
        }
        var issues = [];
        if (!supportsModules) issues.push('当前浏览器版本过旧（不支持 3D 页面加载）');
        if (!supportsWebGL) issues.push('WebGL 3D 渲染不可用');
        if (issues.length) {
          // 内核不支持：引导用系统浏览器打开（微信内也适用）
          addLayer(
            '<div style="font-size:18px;font-weight:600;color:#1f2937;">无法显示 3D 展厅</div>' +
            '<div style="font-size:14px;color:#6b7280;">' + issues.join('；') + '</div>' +
            '<div style="font-size:13px;color:#6b7280;line-height:1.9;">' +
            (isWeChat
              ? '请点击右上角「···」→ 选择「在浏览器中打开」<br>使用 Chrome / Safari 打开即可正常浏览'
              : '请使用最新版 Chrome / Safari / Edge 浏览器打开') +
            '</div>'
          );
          return;
        }
        // 微信内且内核可用：直接显示 3D（无顶部提示条，保持画面干净）
      } catch (e) { /* 检测失败不阻塞页面 */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="device-panel">
    <div id="brand"><img class="logo-img" src="logo2.png" alt="耐锢科技" /><span class="logo-text">耐锢科技</span></div>
    <h3>设备列表</h3>
    <div id="device-list"></div>
  </div>

  <div id="detail-panel">
    <div class="dp-head">
      <div class="dp-name"></div>
      <button id="dp-collapse" title="收起面板（看模型）">—</button>
    </div>
    <div class="dp-desc"></div>
    <table class="dp-params"></table>
    <div class="dp-status"></div>
    <button id="back-btn">← 返回全景</button>
  </div>
  <div id="dp-mini" class="hidden">📋 设备参数</div>

  <button id="share-btn">分享 / 二维码</button>

  <div id="share-panel">
    <div class="sp-head">分享给微信 / 手机</div>
    <div class="sp-url-row">
      <input id="share-url" readonly />
      <button id="share-copy">复制</button>
    </div>
    <div class="sp-qr-wrap"><canvas id="share-qr" width="180" height="180"></canvas></div>
    <div id="share-note"></div>
  </div>

  <button id="lobby-btn" title="返回大厅">⌂ 返回大厅</button>

  <!-- 详情内高模加载进度条（顶部细条，不遮画面；后台下载/升级高清时显示） -->
  <div id="hi-progress" class="hidden">
    <div id="hi-bar"></div>
    <span id="hi-pct">0%</span>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">初始化中…</div>
    <div class="progress-wrap"><div id="progress-bar"></div></div>
    <div id="progress-pct">0%</div>
  </div>

  <!-- 备用 CDN（本地 lib/ 不可用时自动切换） -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script>
    window.__CDNS = [
      { name: 'unpkg',     three: 'https://unpkg.com/three@0.160.0/build/three.module.js',          addons: 'https://unpkg.com/three@0.160.0/examples/jsm/', gui: 'https://unpkg.com/lil-gui@0.20.0/dist/lil-gui.esm.min.js' },
      { name: 'jsdelivr',  three: 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js', addons: 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/', gui: 'https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js' },
      { name: 'npmmirror', three: 'https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js', addons: 'https://registry.npmmirror.com/three/0.160.0/files/examples/jsm/', gui: 'https://registry.npmmirror.com/lil-gui/0.20.0/files/dist/lil-gui.esm.min.js' }
    ];
    function __injectImportMap(cdn) {
      var s = document.createElement('script');
      s.type = 'importmap';
      s.textContent = JSON.stringify({ imports: { 'three': cdn.three, 'three/addons/': cdn.addons } });
      document.head.appendChild(s);
    }
  </script>

  <script type="module">
    /* ============================================================
     *  耐锢科技线上展厅（3D 设备层级下钻展示）
     *  状态机：OVERVIEW(全景) -> TRANSITION(飞行/加载) -> DETAIL(详情)
     *          DETAIL -> TRANSITION -> OVERVIEW（返回）
     *  内存管理：全景低模 = 常驻 InstancedMesh（共享几何体/材质，永不重建）
     *            详情高模 = 按需加载，返回时递归释放 geometry/material/texture
     * ============================================================ */
    const overlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const progressBar = document.getElementById('progress-bar');
    const progressPct = document.getElementById('progress-pct');
    const hiProgress = document.getElementById('hi-progress');
    const hiBar = document.getElementById('hi-bar');
    const hiPct = document.getElementById('hi-pct');
    // 详情内高模加载进度条（顶部细条）：pct 0-100，null 隐藏
    function showHiProgress(pct) {
      if (pct == null) { hiProgress.classList.add('hidden'); return; }
      hiProgress.classList.remove('hidden');
      const p = Math.max(0, Math.min(100, Math.round(pct * 100)));
      hiBar.style.setProperty('--w', p + '%');
      hiPct.textContent = p + '%';
    }

    /* ============ PC / 移动端性能分级（全局） ============
     * isMobile：UA 或屏幕宽度 <768px 判定
     * PERF 分级参数：像素比 / 抗锯齿 / 阴影 / 详情是否升级高模 / 材质降级
     */
    const isMobile = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(navigator.userAgent)
      || innerWidth < 768;
    const PERF = isMobile ? {
      pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),  // 移动端 ≤1.5
      antialias: false,                                         // 移动端关抗锯齿
      shadows: false,                                           // 移动端关阴影
      upgradeHigh: false,                                       // 移动端详情只用低模(缩略)
      downgradeMaterial: true                                   // 移动端 PBR→Phong
    } : {
      pixelRatio: window.devicePixelRatio || 1.5,               // PC：完全使用设备像素比（通常1.5~2.0），绝不限为1
      antialias: true,                                          // PC 开抗锯齿
      shadows: true,                                            // PC 开阴影
      upgradeHigh: true,                                        // PC 升级高清（细节全保留）
      downgradeMaterial: false
    };
    // 兼容旧引用：isMobile 已全局化（下方各函数直接用）

    // 模型资源版本号：仅在模型/缩略图文件内容更新时递增！
    // 页面逻辑改动（UI/性能）不递增 → 已下载的 glb 命中浏览器缓存，避免每次改版都重下几十 MB
    const MODEL_VER = 44;
    const ver = (url) => url + (url.includes('?') ? '&' : '?') + 'v=' + MODEL_VER;

    function showFatal(msg) {
      overlay.classList.remove('hidden');
      overlay.classList.add('error');
      loadingText.textContent = '加载失败：' + msg;
      progressBar.style.width = '100%';
    }

    // ---------- 加载 three.js（本地优先，CDN 回退） ----------
    let THREE, OrbitControls, GLTFLoader, GUI, EffectComposer, RenderPass, UnrealBloomPass, RGBELoader, RoomEnvironment, DRACOLoader, RectAreaLightUniformsLib;
    try {
      // 并行加载所有引擎库（模块间无依赖 → 并发下载，首屏显著提速）
      const [m3, mOC, mGLTF, mGUI, mRGBE, mRoom, mDraco, mRAL, mEC, mRP, mBloom] = await Promise.all([
        import('./lib/three.module.js'),
        import('./lib/OrbitControls.js'),
        import('./lib/GLTFLoader.js'),
        import('./lib/lil-gui.esm.min.js'),
        import('./lib/RGBELoader.js'),
        import('./lib/environments/RoomEnvironment.js'),
        import('./lib/DRACOLoader.js'),
        import('./lib/RectAreaLightUniformsLib.js'),
        import('./lib/postprocessing/EffectComposer.js'),
        import('./lib/postprocessing/RenderPass.js'),
        import('./lib/postprocessing/UnrealBloomPass.js')
      ]);
      THREE = m3;
      OrbitControls = mOC.OrbitControls;
      GLTFLoader = mGLTF.GLTFLoader;
      GUI = mGUI.default;
      RGBELoader = mRGBE.RGBELoader;
      RoomEnvironment = mRoom.RoomEnvironment;
      DRACOLoader = mDraco.DRACOLoader;
      RectAreaLightUniformsLib = mRAL.RectAreaLightUniformsLib;
      RectAreaLightUniformsLib.init();   // 柔光箱（RectAreaLight）着色器初始化
      EffectComposer = mEC.EffectComposer;
      RenderPass = mRP.RenderPass;
      UnrealBloomPass = mBloom.UnrealBloomPass;
      console.log('[线上展厅] 使用本地依赖');
    } catch (e) {
      console.warn('[线上展厅] 本地依赖不可用，尝试 CDN', e);
      let ok = false;
      for (const cdn of window.__CDNS) {
        try {
          __injectImportMap(cdn);
          THREE = await import('three');
          OrbitControls = (await import('three/addons/controls/OrbitControls.js')).OrbitControls;
          GLTFLoader = (await import('three/addons/loaders/GLTFLoader.js')).GLTFLoader;
          GUI = (await import(cdn.gui)).default;
          EffectComposer = (await import('three/addons/postprocessing/EffectComposer.js')).EffectComposer;
          RenderPass = (await import('three/addons/postprocessing/RenderPass.js')).RenderPass;
          UnrealBloomPass = (await import('three/addons/postprocessing/UnrealBloomPass.js')).UnrealBloomPass;
          RGBELoader = (await import('three/addons/loaders/RGBELoader.js')).RGBELoader;
          RoomEnvironment = (await import('three/addons/environments/RoomEnvironment.js')).RoomEnvironment;
          DRACOLoader = (await import('three/addons/loaders/DRACOLoader.js')).DRACOLoader;
          RectAreaLightUniformsLib = (await import('three/addons/lights/RectAreaLightUniformsLib.js')).RectAreaLightUniformsLib;
          RectAreaLightUniformsLib.init();
          console.log('[线上展厅] 使用 CDN:', cdn.name);
          ok = true;
          break;
        } catch (e2) { console.warn('CDN 失败', cdn.name, e2); }
      }
      if (!ok) { showFatal('3D 引擎加载失败，请检查网络后刷新'); throw new Error('no engine'); }
    }

    /* ================= 状态机 ================= */
    const Mode = Object.freeze({ OVERVIEW: 0, TRANSITION: 1, DETAIL: 2 });
    const state = {
      mode: Mode.OVERVIEW,   // 当前场景模式
      devices: [],           // models.json 的设备列表
      selectedIndex: -1,     // 当前选中的设备下标（-1 = 未选中）
      highModel: null,       // 当前详情模式的高精度模型（可卸载）
      loadToken: 0,          // 竞态令牌：新加载使旧加载失效
      enterToken: 0,         // 进入流程令牌：返回/切换会使其失效
      exitToken: 0,          // 退出流程令牌
      userTouched: false,    // 用户是否已手动旋转/缩放详情相机（高模替换后不再强制重置视角）
      upgrading: false,      // 是否后台高清升级中（状态栏显示百分比）
    };

    /* ================= 双层渲染器（PC/移动端分级） ================= */
    const app = document.getElementById('app');
    function makeRenderer(alpha, id) {
      let r;
      try { r = new THREE.WebGLRenderer({ antialias: PERF.antialias, alpha, powerPreference: 'high-performance', logarithmicDepthBuffer: isMobile }); }
      catch (e1) {
        try { r = new THREE.WebGLRenderer({ antialias: false, alpha }); }
        catch (e2) { showFatal('WebGL 不可用'); throw e2; }
      }
      r.setPixelRatio(PERF.pixelRatio);   // PC≤2 / 移动≤1.5（按 PERF 分级）
      r.setSize(innerWidth, innerHeight);
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;   // 电影级色调映射
      r.toneMappingExposure = 1.0;
      // 阴影：PC 开启；移动端关闭（显著降低 GPU 压力）
      r.shadowMap.enabled = PERF.shadows;
      if (PERF.shadows) r.shadowMap.type = THREE.PCFSoftShadowMap;
      r.domElement.id = id;
      app.appendChild(r.domElement);
      return r;
    }
    // 底层：全景低模场景（背景不透明，可被 CSS 虚化）
    const rendererLow = makeRenderer(false, 'low-canvas');
    // 顶层：详情高精度模型（透明背景，叠加在底层上方）
    const rendererHigh = makeRenderer(true, 'high-canvas');
    // WebGL 崩溃防护：context lost 后 three 无法自动重建场景（大模型内存压力下的崩溃）。
    // 手机端：自动刷新页面恢复（模型已有 IndexedDB 缓存 → 刷新后秒回，避免黑屏卡死/反复崩）
    [rendererLow, rendererHigh].forEach(r => {
      r.domElement.addEventListener('webglcontextlost', e => {
        e.preventDefault();
        console.warn('[线上展厅] WebGL context lost');
        try {
          // 防循环：仅当未 reload 过才自动刷新；已 reload 过则静默降载等待恢复
          if (!sessionStorage.getItem('ng-reloaded')) {
            sessionStorage.setItem('ng-reloaded', '1');
            setTimeout(() => { try { location.reload(); } catch (err) {} }, 200);
          } else {
            sessionStorage.removeItem('ng-reloaded');
          }
        } catch (err) {}
      });
    });
    // 进入页面时清除 reload 标记（保证每次全新会话可自动恢复一次）
    try { sessionStorage.removeItem('ng-reloaded'); } catch (err) {}

    // 共享相机 + 控制器（交互绑定顶层画布）
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 2000);
    const controls = new OrbitControls(camera, rendererHigh.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.zoomToCursor = true;   // 滚轮以鼠标位置为定点放大（用户体验优化）
    // 用户开始手动旋转/缩放 → 标记已交互（高模替换后不再强制重置视角，尊重用户当前视角）
    controls.addEventListener('start', () => { if (state.mode === Mode.DETAIL) state.userTouched = true; });

    /* ================= 全景场景（低模，常驻）—— 赛博朋克视觉 ================= */

    // ---------- ① 背景系统（纯色可调 + 雾色联动，默认淡蓝灰摄影棚） ----------
    function setupBackground(scene) {
      scene.background = new THREE.Color(0xa8adb5);   // 淡蓝灰背景墙纸（gui 可调）
      scene.fog = new THREE.Fog(0xcbd5e1, 30, 120);    // 雾色与背景一致；默认雾化距离最大（远 120）
    }

    // ---------- ② 灯光系统（高端展厅：顶部条形灯 + 中心聚光 + 冷白高对比） ----------
    function setupLights(scene, renderer) {
      const lights = [];
      // 顶部条形灯（冷白 RectAreaLight 宽条形，明亮顶光）
      const strip = new THREE.RectAreaLight(0xeaf2ff, 6, 16, 2.5);
      strip.position.set(0, 13, 0);
      strip.lookAt(0, 0, 0);
      scene.add(strip);
      lights.push(strip);
      // 中心聚光灯（聚焦展台中心，冷白，高对比光影）
      const spot = new THREE.SpotLight(0xf0f7ff, 300, 120, 0.5, 0.35, 1.5);
      spot.position.set(0, 16, 4);
      spot.target.position.set(0, 0, 0);
      scene.add(spot, spot.target);
      lights.push(spot);
      if (renderer) {
        spot.castShadow = true;
        spot.shadow.mapSize.set(1024, 1024);
        spot.shadow.camera.fov = 60;
        spot.shadow.camera.near = 1;
        spot.shadow.camera.far = 80;
        spot.shadow.camera.updateProjectionMatrix();
        spot.shadow.bias = -0.0005;
      }
      // 极弱环境光（暗场，保中心聚光的高对比）
      scene.add(new THREE.AmbientLight(0xffffff, 0.12));
      return { lights };
    }

    // ---------- ③ 地面系统（反光地板：微妙渐变 + 高反射，中性灰摄影棚地） ----------
    function setupGround(scene) {
      // 反光地板渐变纹理：中心微亮 #eceff4 → 边缘中性灰 #c6cdd8（微妙渐变，无暗角）
      const gcv = document.createElement('canvas');
      gcv.width = 1024; gcv.height = 1024;
      const gctx = gcv.getContext('2d');
      const gg = gctx.createRadialGradient(512, 512, 150, 512, 512, 740);
      gg.addColorStop(0, '#a5aab2');
      gg.addColorStop(1, '#7c828c');
      gctx.fillStyle = gg;
      gctx.fillRect(0, 0, 1024, 1024);
      const gtex = new THREE.CanvasTexture(gcv);
      gtex.colorSpace = THREE.SRGBColorSpace;
      // 大理石地面：巨大平面 200x200，清漆反光 + 渐变
      // roughness 0.3 半光滑 / clearcoat 1.0 抛光 / envMapIntensity 1.5 强环境反射（微妙倒影感）
      const marble = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshPhysicalMaterial({
          color: 0xffffff, map: gtex, roughness: 0.3, metalness: 0.05,
          clearcoat: 1.0, clearcoatRoughness: 0.1,
          envMapIntensity: 1.5
        })
      );
      marble.rotation.x = -Math.PI / 2;
      marble.position.y = 0;
      marble.receiveShadow = true;   // 接触阴影
      scene.add(marble);
      return { marble };
    }

    // ---------- ④ 设备低模（直接落在大理石地面） ----------
    const N = 8;                  // 设备数量（展厅固定 8 台）
    const R = 5.0;                // 设备环绕半径
    let bodyMesh, baseMesh, labels, defaultColors, devicePositions;
    const palette = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa29bfe, 0xff8a5c, 0x55efc4, 0xff6b8a, 0x74b9ff, 0xfd79a8, 0x00cec9];
    function setupDevices(scene) {
      devicePositions = [];
      // 机身/底座：反射灯光更有质感的材质（metalness 0.3 / roughness 0.4），极淡青色自发光
      const deviceMat = new THREE.MeshStandardMaterial({
        roughness: 0.4, metalness: 0.3, color: 0xffffff,
        emissive: 0x00ffff, emissiveIntensity: 0.1
      });
      bodyMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.85, 0.85, 0.85), deviceMat, N);
      baseMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.5, 0.62, 0.14, 24), deviceMat, N);
      bodyMesh.castShadow = true;   // 投射阴影 → 大理石地面上的接触阴影
      baseMesh.castShadow = true;
      defaultColors = [];
      const dummy = new THREE.Object3D();
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const p = new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R);
        devicePositions.push(p);
        // 机身（直接落地）
        dummy.position.set(p.x, 0.55, p.z);
        dummy.rotation.set(0, -a + Math.PI / 2, 0);
        dummy.updateMatrix();
        bodyMesh.setMatrixAt(i, dummy.matrix);
        // 底座
        dummy.position.set(p.x, 0.07, p.z);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        baseMesh.setMatrixAt(i, dummy.matrix);
        // 实例颜色（区分设备）
        const c = new THREE.Color(palette[i]);
        bodyMesh.setColorAt(i, c);
        baseMesh.setColorAt(i, c.clone().multiplyScalar(0.55));
        defaultColors.push(c);
      }
      bodyMesh.instanceColor.needsUpdate = true;
      baseMesh.instanceColor.needsUpdate = true;
      scene.add(bodyMesh, baseMesh);
      // 名称标签（Sprite 文字纹理，不受雾影响）
      labels = [];
      function makeLabel(text, i) {
        const cv = document.createElement('canvas');
        // canvas 宽度按文本实际长度自适应（长名称如「22RS中间台+压机」不被裁剪）
        const LABEL_FONT = 'bold 34px "Microsoft YaHei", sans-serif';
        const meas = document.createElement('canvas').getContext('2d');
        meas.font = LABEL_FONT;
        const textW = Math.ceil(meas.measureText(text).width) + 40;   // 左右留白 20px
        cv.width = Math.max(120, textW); cv.height = 64;
        const ctx = cv.getContext('2d');
        ctx.font = LABEL_FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, cv.width, 64);
        ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 6;
        ctx.strokeText(text, cv.width / 2, 34);
        ctx.fillStyle = '#eaf2ff'; ctx.fillText(text, cv.width / 2, 34);
        const tex = new THREE.CanvasTexture(cv);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        // 世界比例随画布宽度自适应（避免长文本被压扁），高度基准 0.55
        const aspect = cv.width / cv.height;
        sp.scale.set(0.55 * aspect, 0.55, 1);
        sp.position.set(devicePositions[i].x, 1.85, devicePositions[i].z);
        sp.userData.deviceId = i;
        sp.renderOrder = 10;
        labels.push(sp);
        scene.add(sp);
      }
      return makeLabel;
    }

    /* ================= 全景场景初始化（模块化组合） ================= */
    const sceneLow = new THREE.Scene();
    setupBackground(sceneLow);
    setupGround(sceneLow);
    setupLights(sceneLow, rendererLow);      // 一盏聚光灯 + 阴影
    const makeLabel = setupDevices(sceneLow);

    /* ================= 高模场景（详情，动态加载/卸载） ================= */
    const sceneHigh = new THREE.Scene();
    // 详情照明：摄影棚柔光箱（前 + 顶棚格栅灯，强度经实测校准）+ 弱环境光
    sceneHigh.add(new THREE.AmbientLight(0xffffff, 0.45));
    const hFront = new THREE.RectAreaLight(0xffffff, 12, 8, 8);
    hFront.position.set(0, 6, 10);
    hFront.lookAt(0, 0.3, 0);
    sceneHigh.add(hFront);
    const hDir2 = new THREE.DirectionalLight(0xffffff, 2.5);   // 主光：照亮模型
    hDir2.position.set(6, 12, 8);
    sceneHigh.add(hDir2);
    const hBack = new THREE.RectAreaLight(0xffffff, 6, 8, 8);
    hBack.position.set(0, 5, -10);
    hBack.lookAt(0, 0.3, 0);
    sceneHigh.add(hBack);
    const hTop = new THREE.RectAreaLight(0xffffff, 14, 10, 10);
    hTop.position.set(0, 12, 0);
    hTop.lookAt(0, 0, 0);
    sceneHigh.add(hTop);

    /* ================= HDRI 环境（金属反射，解决发黑；不影响背景色） ================= */
    // 用 RGBELoader 加载工业风 HDRI → PMREM 环境贴图 → 全景/详情共享 scene.environment
    // scene.background 保持淡蓝灰摄影棚（#cbd5e1），HDRI 只作环境反射来源
    // 优先级：polyhaven → 本地 hdr/ → jsdelivr；全部失败则跳过（聚光灯仍可照明）
    const HDR_SOURCES = [
      'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/studio_small_09_2k.hdr',   // 摄影棚风格：无缝360°、中性灰、柔光箱、均匀照明
      'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/industrial_sunset_puresky_1k.hdr',
      './hdr/studio.hdr',
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/equirectangular/royal_esplanade_1k.hdr'
    ];
    const rgbe = new RGBELoader();
    const pmremEnv = new THREE.PMREMGenerator(rendererLow);
    // ① 立即用 RoomEnvironment 设置环境（同步，纯金属模型瞬间有反射，不会黑）
    // ② 异步加载 HDRI，成功后替换（更真实；失败则保持 RoomEnvironment）
    const envFallback = pmremEnv.fromScene(new RoomEnvironment(), 0.04).texture;
    sceneLow.environment = envFallback;
    sceneHigh.environment = envFallback;
    function loadEnv(index) {
      if (index >= HDR_SOURCES.length) { console.warn('[线上展厅] HDRI 加载失败，保持 RoomEnvironment 环境'); return; }
      rgbe.load(HDR_SOURCES[index], tex => {
        tex.mapping = THREE.EquirectangularReflectionMapping;
        window.__hdrBg = tex;   // 保留 equirect 纹理（HDRI 背景用）
        const env = pmremEnv.fromEquirectangular(tex).texture;
        sceneLow.environment = env;    // ← 关键：全景金属反射光
        sceneHigh.environment = env;   // ← 关键：详情金属反射光
        // 背景同步为 HDRI（受「HDRI 背景」开关控制，默认开；关闭回淡蓝灰）
        if (params.hdrBackground !== false) sceneLow.background = tex;
        tex.needsUpdate = true;
        pmremEnv.dispose();
        console.log('[线上展厅] HDRI 环境已应用:', HDR_SOURCES[index]);
      }, null, () => loadEnv(index + 1));
    }
    loadEnv(0);
    // 环境强度全局控制（HDR 调节）
    // 大厅（sceneLow）跟随滑条（默认 0.1，光线柔和不刺眼）；
    // 详情（sceneHigh）不低于 1.5（金属模型必须有足够反射，否则发黑）
    function setEnvIntensity(k) {
      const apply = (sc, v) => {
        sc.traverse(o => {
          if (o.isMesh && o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(m => { if (m && 'envMapIntensity' in m) m.envMapIntensity = v; });
          }
        });
      };
      apply(sceneLow, k);                 // 大厅：默认 0.1
      apply(sceneHigh, Math.max(k, 2.0)); // 详情：至少 2.0（明亮清晰）
    }

    const loader = new GLTFLoader();
    // Draco 解码（models/device-XX.glb 已用 gltf-transform Draco 压缩，体积缩小 6~14 倍）
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('./lib/draco/');
    // 不强制 type → wasm 优先（比 JS 快约 10 倍），加载失败自动回退 JS 解码器
    loader.setDRACOLoader(dracoLoader);

    /* ============ IndexedDB 模型缓存（ArrayBuffer 存取，全静默降级） ============ */
    const IDB_NAME = 'ng3d-cache', IDB_STORE = 'models';
    let idbReady = false, idbDb = null;
    function openIdb() {
      return new Promise(res => {
        if (idbReady) return res(idbDb);
        if (!window.indexedDB) return res(null);
        let req;
        try { req = window.indexedDB.open(IDB_NAME, 1); } catch (e) { return res(null); }
        req.onupgradeneeded = () => {
          try {
            const db = req.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
          } catch (e) {}
        };
        req.onsuccess = () => { idbDb = req.result; idbReady = true; res(idbDb); };
        req.onerror = () => res(null);
        req.onblocked = () => res(null);
      });
    }
    // 读取缓存 ArrayBuffer；失败/未命中返回 null（不抛错）
    async function idbGet(key) {
      try {
        const db = await openIdb();
        if (!db) return null;
        return await new Promise(res => {
          try {
            const tx = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
            tx.onsuccess = () => res(tx.result instanceof ArrayBuffer ? tx.result : null);
            tx.onerror = () => res(null);
          } catch (e) { res(null); }
        });
      } catch (e) { return null; }
    }
    // 写入缓存；失败静默忽略
    async function idbPut(key, buffer) {
      try {
        const db = await openIdb();
        if (!db) return;
        await new Promise(res => {
          try {
            const tx = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(buffer, key);
            tx.onsuccess = () => res();
            tx.onerror = () => res();
          } catch (e) { res(); }
        });
      } catch (e) {}
    }

    /* 缓存优先的 GLB 加载（替代 loader.load）：
     * 1) IndexedDB 命中 → loader.parse() 直接解析（无网络请求）
     * 2) 未命中 → XHR 网络下载（带进度）→ 写入 IndexedDB → parse
     * 3) IndexedDB 读写失败 → 静默降级纯网络加载，不阻断渲染
     */
    function loadGLB(url, onLoad, onProgress, onError) {
      let done = false;
      const safeLoad = (buf) => {
        if (done) return; done = true;
        // 解析(含 Draco 解码)前进度置 100%：下载/缓存已就绪，避免解码期停留 0% 或中途百分比
        if (onProgress) onProgress({ loaded: 1, total: 1 });
        try { loader.parse(buf, '', onLoad, onError); }
        catch (e) { if (onError) onError(e); }
      };
      (async () => {
        // 1) 尝试缓存
        let buf = null;
        try { buf = await idbGet(url); } catch (e) { buf = null; }
        if (buf) {
          if (onProgress) onProgress({ loaded: 1, total: 1 });   // 缓存命中：立即 100%（读取中）
          safeLoad(buf); return;
        }
        // 2) 网络下载（XHR 支持进度）
        try {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.responseType = 'arraybuffer';
          let clen = 0, evCount = 0;   // Content-Length / 进度事件计数
          xhr.onreadystatechange = () => {
            // 尽早读取响应头 Content-Length（真实总字节）
            try { if (!clen && xhr.readyState >= 2) { const h = xhr.getResponseHeader('Content-Length'); if (h) clen = parseInt(h, 10) || 0; } } catch (e) {}
          };
          xhr.onprogress = e => {
            if (!onProgress) return;
            if (e.lengthComputable && e.total > 0) { onProgress({ loaded: e.loaded, total: e.total }); return; }
            // 无长度事件：优先用响应头 Content-Length 计算真实百分比
            if (clen > 0 && e.loaded > 0) { onProgress({ loaded: Math.min(e.loaded, clen), total: clen }); return; }
            // 完全无长度信息：按事件数平滑递增（10→25→40→55→70→85→92），绝不恒停一值
            evCount++;
            const steps = [0.1, 0.25, 0.4, 0.55, 0.7, 0.85, 0.92];
            onProgress({ loaded: steps[Math.min(evCount - 1, steps.length - 1)], total: 1 });
          };
          xhr.onload = () => {
            if (xhr.status !== 200 && xhr.status !== 0) { if (onError) onError(); return; }
            const ab = xhr.response;
            if (!ab) { if (onError) onError(); return; }
            // 3) 写入缓存（失败忽略，不阻断）
            idbPut(url, ab);
            safeLoad(ab);
          };
          xhr.onerror = () => { if (onError) onError(); };
          xhr.ontimeout = () => { if (onError) onError(); };
          xhr.send();
        } catch (e) { if (onError) onError(); }
      })();
    }

    /* ================= 全景缩略模型（有模型→显示缩略，无模型→保留立方体） ================= */
    const thumbObjects = [];   // 全景缩略模型（可点击）
    // 缩略图已全部经 simplify+join 轻量化（mesh 数从数千降到 ~100、体积 2-6MB），
    // 全景可直接显示；此黑名单暂空（原用于跳过超大缩略防移动端崩溃）
    const HEAVY_MODELS = [];
    const isHeavyModel = (model) => HEAVY_MODELS.includes(model);
    // 加载单台缩略模型（有模型→显示缩略；失败/无文件→保留立方体占位）
    function loadOneThumb(d, i, onProgress) {
      return new Promise(resolve => {
        // 超大模型全景不加载 3D 缩略（保留立方体占位，防内存崩溃）
        if (isHeavyModel(d.model)) { resolve(); return; }
        // 缩略路径：models/device-XX.glb → models/thumb/device-XX.glb；
        // d1(model.glb) → models/thumb/device-01.glb（全景用轻量缩略，避免加载 11MB 原模型）
        const thumbUrl = d.model.startsWith('models/')
          ? d.model.replace('models/', 'models/thumb/')
          : 'models/thumb/device-01.glb';
        loadGLB(ver(thumbUrl), gltf => {
          const obj = gltf.scene || gltf.scenes[0];
          markLogoNodes(obj);   // LOGO 打标保留显示，不参与缩放/落地计算
          if (PERF.downgradeMaterial) downgradeMobileMaterial(obj);   // 移动端全景缩略同样 PBR→Phong
          const box = boxExcl(obj);
          const size = box.getSize(new THREE.Vector3());
          if (size.x <= 0 || size.y <= 0 || size.z <= 0) { resolve(); return; }
          // 缩放到占位立方体尺寸（0.85），最长边为基准
          const scale = 0.85 / Math.max(size.x, size.y, size.z);
          obj.scale.setScalar(scale);
          // 缩放后重算包围盒（world matrix 需更新才会反映 scale）
          obj.updateMatrixWorld(true);
          box.copy(boxExcl(obj));
          const c = box.getCenter(new THREE.Vector3());
          const p = devicePositions[i];
          // 底部对齐地面（y=0）：-box.min.y 使模型完整立于地面，不埋入/不悬空
          obj.position.set(p.x - c.x, -box.min.y, p.z - c.z);
          obj.userData.deviceId = i;
          obj.traverse(o => { if (o.isMesh) o.userData.deviceId = i; });   // 子网格可点击命中
          thumbObjects.push(obj);
          // 详情模式中加载完成的缩略直接释放（不驻留），返回全景后统一重建
          if (state.mode === Mode.DETAIL) {
            disposeObject(obj);
            thumbObjects.pop();
            resolve();
            return;
          }
          sceneLow.add(obj);
          setEnvIntensity(params.envIntensity);   // 大厅缩略模型也应用 0.1（不刺眼）
          // 隐藏对应立方体实例（矩阵缩放为 0）
          const hide = new THREE.Object3D();
          hide.position.set(p.x, 0, p.z);
          hide.scale.set(0.0001, 0.0001, 0.0001);
          hide.updateMatrix();
          bodyMesh.setMatrixAt(i, hide.matrix);
          baseMesh.setMatrixAt(i, hide.matrix);
          bodyMesh.instanceMatrix.needsUpdate = true;
          baseMesh.instanceMatrix.needsUpdate = true;
          console.log('[线上展厅] 全景缩略已加载:', d.name, '(' + thumbUrl + ')');
          resolve();
        }, onProgress, () => { resolve(); });   // 无缩略文件 → 保留立方体占位
      });
    }
    // 并发加载缩略：每批 3 台同时下载（比串行快数倍——总时长≈最慢单台×批数，
    // 缩略已 join 轻量(mesh 6-102)，并发 3 台内存/带宽可控）
    function loadThumbsFrom(fromIndex, onProgress) {
      const total = state.devices.length;
      if (fromIndex >= total) return Promise.resolve();
      const BATCH = 3;
      return (async () => {
        for (let b = fromIndex; b < total; b += BATCH) {
          const batch = [];
          for (let i = b; i < Math.min(b + BATCH, total); i++) {
            batch.push(loadOneThumb(state.devices[i], i));
          }
          await Promise.all(batch);
          if (onProgress) onProgress(Math.min(1, (Math.min(b + BATCH, total) - fromIndex) / (total - fromIndex)));
        }
        console.log('[线上展厅] 全部全景缩略加载完成');
        // 后台静默预取各设备高模到 IndexedDB（点击进详情时直接命中缓存 → 高清秒开）
        // 仅 PC 预取（移动端不加载高模）；逐个下载，避免并发带宽抢占
        if (PERF.upgradeHigh && state.devices.length) {
          setTimeout(() => {
            (async () => {
              for (let i = 0; i < state.devices.length; i++) {
                const d = state.devices[i];
                const url = ver(d.model);
                if (await idbGet(url)) continue;   // 已缓存跳过
                try {
                  const r = await fetch(url);
                  if (r.ok) {
                    const ab = await r.arrayBuffer();
                    await idbPut(url, ab);
                    console.log('[线上展厅] 已预取高模缓存:', d.name);
                  }
                } catch (e) { /* 预取失败静默忽略 */ }
              }
              console.log('[线上展厅] 高模预取完成');
            })();
          }, 800);
        }
      })();
    }

    // 释放全部全景缩略模型（进入详情时调用）：
    // 移除出场景 + dispose geometry/material（真正归还 GPU 显存），并恢复占位立方体。
    // 之前仅 visible=false 不释放内存 → 全景缩略(数百万面)与详情大模型同驻显存导致手机崩溃
    function releaseThumbnails() {
      const dummy = new THREE.Object3D();
      while (thumbObjects.length) {
        const o = thumbObjects.pop();
        if (o && o.parent) o.parent.remove(o);
        disposeObject(o);
      }
      // 恢复占位立方体（有缩略的设备原本被 scale≈0 隐藏）
      for (let i = 0; i < N; i++) {
        const p = devicePositions[i];
        dummy.position.set(p.x, 0.55, p.z);
        dummy.rotation.set(0, -(i / N) * Math.PI * 2 + Math.PI / 2, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        bodyMesh.setMatrixAt(i, dummy.matrix);
        dummy.position.set(p.x, 0.07, p.z);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        baseMesh.setMatrixAt(i, dummy.matrix);
      }
      bodyMesh.instanceMatrix.needsUpdate = true;
      baseMesh.instanceMatrix.needsUpdate = true;
      console.log('[线上展厅] 全景缩略已释放（进入详情，归还 GPU 内存）');
    }

    /* ================= 内存管理：递归释放模型资源 ================= */
    function disposeObject(obj) {
      obj.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (!m) return;
            for (const k in m) if (m[k] && m[k].isTexture) m[k].dispose();
            m.dispose();
          });
        }
      });
    }
    function unloadHighModel() {
      if (!state.highModel) return;
      sceneHigh.remove(state.highModel);
      disposeObject(state.highModel);
      state.highModel = null;
      console.log('[线上展厅] 已卸载高精度模型，内存已释放');
    }

    // 标记「耐固LOGO」独立节点：不删除（LOGO 按模型位置正常显示），仅打标
    // 使 boxExcl 在计算包围盒/取景时排除 LOGO，避免其拉偏旋转中心与缩放比例
    function markLogoNodes(obj) {
      if (!obj) return;
      obj.traverse(o => {
        if (o.isMesh) return;
        if (/耐固LOGO|LOGO\.\d|^LOGO$/i.test(o.name || '')) {
          let hasMesh = false;
          o.traverse(c => { if (c.isMesh) hasMesh = true; });
          if (hasMesh) { o.userData.isLogo = true; o.traverse(c => { c.userData.isLogo = true; }); }
        }
      });
    }

    // 计算排除 LOGO 子树的包围盒（LOGO 仍渲染显示，但不参与缩放/取景/落地计算）
    function boxExcl(obj) {
      const box = new THREE.Box3();
      obj.updateMatrixWorld(true);
      const stack = [obj];
      while (stack.length) {
        const n = stack.pop();
        if (n.userData && n.userData.isLogo) continue;   // 跳过 LOGO 整棵子树
        if (n.isMesh) box.expandByObject(n);
        for (const c of n.children || []) stack.push(c);
      }
      return box;
    }

    /* ================= 相机飞行（平滑缓动） ================= */
    function easeInOutCubic(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function flyTo(pos, tgt, dur = 900) {
      return new Promise(res => {
        const p0 = camera.position.clone();
        const t0 = controls.target.clone();
        const start = performance.now();
        controls.enabled = false;   // 飞行期间锁定交互
        (function step(now) {
          const k = Math.min(1, (now - start) / dur);
          const e = easeInOutCubic(k);
          camera.position.lerpVectors(p0, pos, e);
          controls.target.lerpVectors(t0, tgt, e);
          controls.update();
          if (k < 1) requestAnimationFrame(step);
          else { controls.enabled = true; res(); }
        })(start);
      });
    }

    // 全景视角 / 详情特写视角
    function overviewView() {
      // 初始视角：相机在 z+ 前方 (0,2.5,8)，视线焦点正对前排设备组中心 (0,0.8,3.8)
      // → 打开画面中央即离相机最近的近处前排设备，后排设备在画面边缘
      return { pos: new THREE.Vector3(0, 2.5, 8), tgt: new THREE.Vector3(0, 0.8, 3.8) };
    }
    function detailView(i) {
      const p = devicePositions[i];
      const dir = p.clone().normalize();
      const pos = p.clone().addScaledVector(dir, 2.4).add(new THREE.Vector3(0, 0.9, 0));
      const tgt = p.clone().add(new THREE.Vector3(0, 0.4, 0));
      return { pos, tgt };
    }

    /* ================= 高亮选中设备（低模实例变色） ================= */
    const HIGHLIGHT = new THREE.Color(0xffd54a);
    function highlightInstance(i) {
      for (let k = 0; k < N; k++) {
        bodyMesh.setColorAt(k, k === i ? HIGHLIGHT : defaultColors[k]);
        baseMesh.setColorAt(k, k === i ? HIGHLIGHT.clone().multiplyScalar(.8) : defaultColors[k].clone().multiplyScalar(.55));
      }
      bodyMesh.instanceColor.needsUpdate = true;
      baseMesh.instanceColor.needsUpdate = true;
    }
    function clearHighlight() {
      for (let k = 0; k < N; k++) {
        bodyMesh.setColorAt(k, defaultColors[k]);
        baseMesh.setColorAt(k, defaultColors[k].clone().multiplyScalar(.55));
      }
      bodyMesh.instanceColor.needsUpdate = true;
      baseMesh.instanceColor.needsUpdate = true;
    }

    /* ================= 加载遮罩 ================= */
    function setLoading(show, text, pct) {
      if (show) {
        overlay.classList.remove('hidden', 'error');
        loadingText.textContent = text || '加载中…';
        const raw = pct === undefined ? 0 : Math.round(pct * 100);
        const p = Math.max(0, Math.min(100, raw));   // 钳制 0-100%（进度事件误差不会超过 100%）
        progressBar.style.width = p + '%';
        progressPct.textContent = p + '%';
      } else {
        overlay.classList.add('hidden');
      }
    }

    /* ================= 平滑进度动画（详情模型加载） =================
     * 真实下载进度作为「目标值」驱动，显示值缓动爬升 → 无论缓存命中还是瞬时下载，
     * 百分比都平滑从 0 走到 100，不会 0→100 跳变，也不会卡 0%。
     */
    let progCur = 0, progTarget = 0, progRAF = 0, progText = '加载中…', progStartAt = 0;
    function setProgText(t) { progText = t; }
    function setProgTarget(t) {
      progTarget = Math.min(1, t);   // 真实进度直接赋值（允许更新/回退，不用 max 挡真实值）
      if (!progRAF) { progStartAt = performance.now(); progRAF = requestAnimationFrame(progStep); }
    }
    function progStep() {
      // 快速跟踪真实目标（0.4/帧），保证显示百分比≈真实下载进度
      progCur += (progTarget - progCur) * 0.4;
      if (progTarget - progCur < 0.001) progCur = progTarget;   // 到位即锁定
      if (progCur >= 1) progCur = 1;
      overlay.classList.remove('hidden', 'error');
      loadingText.textContent = progText;
      const p = Math.round(progCur * 100);
      progressBar.style.width = p + '%';
      progressPct.textContent = p + '%';
      if (progCur < 1) progRAF = requestAnimationFrame(progStep);
      else { progRAF = 0; }
    }
    // 等待进度动画到达 100%（成功路径用）。
    // 保证最小展示时长：即使缓存/瞬时加载，百分比也要平滑 0→100 可见（最快 ~700ms），
    // 上限 2.5s 兜底防卡
    function waitProgDone() {
      return new Promise(res => {
        const t0 = performance.now();
        (function ck() {
          const minShown = (performance.now() - progStartAt) >= 350;   // 至少展示 350ms（借/缓存瞬时也快速进入）
          if ((progCur >= 0.999 && minShown) || performance.now() - t0 > 2000) res();
          else requestAnimationFrame(ck);
        })();
      });
    }
    function stopProgressAnim() { if (progRAF) { cancelAnimationFrame(progRAF); progRAF = 0; } }

    /* ================= 详情面板 ================= */
    const panel = document.getElementById('detail-panel');
    const panelName = panel.querySelector('.dp-name');
    const panelDesc = panel.querySelector('.dp-desc');
    const panelParams = panel.querySelector('.dp-params');
    const panelStatus = panel.querySelector('.dp-status');
    const dpMini = document.getElementById('dp-mini');
    // 面板折叠：收起后只留迷你标签条，不遮挡模型
    function collapsePanel() {
      panel.classList.add('collapsed');
      panel.classList.remove('show');
      dpMini.classList.remove('hidden');
    }
    function expandPanel() {
      panel.classList.remove('collapsed');
      panel.classList.add('show');
      dpMini.classList.add('hidden');
    }
    document.getElementById('dp-collapse').addEventListener('click', collapsePanel);
    dpMini.addEventListener('click', expandPanel);
    function setStatus(text, cls) {
      panelStatus.textContent = text;
      panelStatus.className = 'dp-status' + (cls ? ' ' + cls : '');
    }
    function openPanel(device) {
      panelName.textContent = device.name;
      panelDesc.textContent = device.desc || '';
      panelParams.innerHTML = '';
      const list = device.params && device.params.length ? device.params : [];
      if (!list.length) {
        panelParams.innerHTML = '<tr><td colspan="2" style="text-align:left;color:rgba(232,236,244,.4)">暂无参数</td></tr>';
      } else {
        list.forEach(it => {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>' + esc(it.k) + '</td><td>' + esc(it.v) + '</td>';
          panelParams.appendChild(tr);
        });
      }
      setStatus('正在加载模型…', 'loading');
      expandPanel();   // 进入新设备时确保面板展开
    }
    function closePanel() {
      panel.classList.remove('show', 'collapsed');
      dpMini.classList.add('hidden');
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ================= 动态加载高精度模型（带进度 + 竞态令牌） ================= */
    // 纹理各向异性：拉近/斜视角时贴图不糊的关键（上限 8，兼顾移动端性能）
    function boostTextures(obj) {
      const maxAniso = rendererHigh.capabilities.getMaxAnisotropy();
      obj.traverse(o => {
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (!m) return;
            for (const k in m) {
              if (m[k] && m[k].isTexture) {
                m[k].anisotropy = Math.min(8, maxAniso);
                m[k].needsUpdate = true;
              }
            }
          });
        }
      });
    }
    // 金属材质可见性增强：metalness=1 + roughness=1 的"粗糙纯金属"在环境不足时呈黑剪影
    // → 提高 envMapIntensity + 略降 metalness（保留金属感，但让漫反射参与，防全黑）
    function ensureMetalVisible(obj) {
      obj.traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (!m || m.isMeshBasicMaterial || m.metalness === undefined) return;
            m.envMapIntensity = Math.max(m.envMapIntensity || 1, 2.0);
            if (m.metalness > 0.7) m.metalness = 0.75;
            m.needsUpdate = true;
          });
        }
      });
    }
    // 移动端材质降级：PBR(Standard/Physical) → Phong，移除环境贴图反射，
    // 显著降低着色器/纹理开销（保留颜色与贴图；金属感由高光近似）
    function downgradeMobileMaterial(obj) {
      obj.traverse(o => {
        if (!o.isMesh || !o.material) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        o.material = mats.map(m => {
          if (!m || m.isMeshPhongMaterial || m.isMeshLambertMaterial || m.isMeshBasicMaterial) return m;
          const phong = new THREE.MeshPhongMaterial({
            color: (m.color || new THREE.Color(0xcccccc)).clone(),
            emissive: m.emissive ? m.emissive.clone() : new THREE.Color(0),
            emissiveIntensity: m.emissiveIntensity !== undefined ? m.emissiveIntensity : 0,
            shininess: 40,               // 近似金属高光
            specular: new THREE.Color(0x666666),
            transparent: m.transparent === true,
            opacity: m.opacity !== undefined ? m.opacity : 1,
            // 移动端稳定性：深度始终写入（防止半透明件与实体穿插穿模）；
            // 双面渲染（防简化/薄壁模型背面丢面现"破洞穿模"感）
            side: THREE.DoubleSide,
            depthWrite: true,
          });
          // 贴图保留（map/normalMap 等；none 则纯色）
          if (m.map) { phong.map = m.map; }
          if (m.normalMap) { phong.normalMap = m.normalMap; }
          if (m.alphaMap) { phong.alphaMap = m.alphaMap; }
          phong.envMap = null;           // 移除环境反射（性能关键）
          phong.needsUpdate = true;
          if (m !== phong) m.dispose();
          return phong;
        });
        o.material = Array.isArray(o.material) && o.material.length === 1 ? o.material[0] : o.material;
      });
    }
    // 模型就位统一材质处理：PC 增强金属可见性；移动端降级 PBR→Phong（性能分级）
    function adaptMaterial(obj) {
      if (PERF.downgradeMaterial) downgradeMobileMaterial(obj);
      else ensureMetalVisible(obj);
    }
    function loadHighModel(device) {
      const token = ++state.loadToken;
      const enterTokenAtCall = state.enterToken;   // 捕获进入令牌：返回/切换会递增它 → 高模就绪后丢弃
      return new Promise(resolve => {
        // 分级加载（统一「低模先出画面 → 后台升级」）：
        //  LOD0 = 优先复用全景已加载的缩略模型（已在内存，零下载瞬时显示）；
        //         无可用缩略时下载移动端中模 (device-XX-mobile.glb / model-mobile.glb)
        //  LOD1 = 精细高模：仅 PC(PERF.upgradeHigh) 在 LOD0 显示后后台加载并无缝替换
        // 检查全景缩略池中是否有该设备（thumbObjects 内 userData.deviceId 匹配）
        const idx = state.selectedIndex;
        let borrowed = null;
        if (idx >= 0) {
          const bi = thumbObjects.findIndex(o => o.userData && o.userData.deviceId === idx);
          if (bi >= 0) {
            borrowed = thumbObjects.splice(bi, 1)[0];   // 借走：从全景池移除（避免被 release 释放）
            if (borrowed.parent) borrowed.parent.remove(borrowed);
          }
        }
        const thumbUrl = device.model.startsWith('models/')
          ? device.model.replace(/\.glb$/, '-mobile.glb')
          : 'model-mobile.glb';
        let firstLoaded = null;   // 第一段显示的模型（LOD0：借用缩略 / 中模）

        // 模型就位（处理材质 + 入场景）；任何路径都必须 resolve，避免 Loading 卡死
        const finish = (obj) => {
          if (token !== state.loadToken) { sceneHigh.remove(obj); disposeObject(obj); resolve(null); return; }
          markLogoNodes(obj);   // LOGO 打标保留显示（取景时经 boxExcl 排除，不影响旋转中心）
          boostTextures(obj);
          adaptMaterial(obj);   // 分级：PC 增强金属 / 移动端 PBR→Phong 降级
          setEnvIntensity(params.envIntensity);
          sceneHigh.add(obj);
          state.highModel = obj;
          resolve(obj);
        };

        // 第二段：后台加载高模（LOD1），就绪后无缝替换缩略并释放缩略内存
        // 注意：完全后台化 —— 不显示全屏遮罩（避免挡住已显示的缩略模型），替换无感
        // 用 enterToken 判断「是否已被返回/切换打断」：进入流程中 mode 是 TRANSITION，
        // 不能拿 mode 判断（直接加载高模时 enterDetail 仍在 await，mode 尚未变为 DETAIL）
        const loadHigh = (allowRetry) => {
          state.upgrading = true;
          loadGLB(ver(device.model), gltf => {
            state.upgrading = false;
            if (token !== state.loadToken) { resolve(null); return; }
            if (state.enterToken !== enterTokenAtCall) {   // 已返回全景或切换到其它设备 → 丢弃
              const drop = gltf.scene || gltf.scenes[0];
              sceneHigh.remove(drop); disposeObject(drop);
              resolve(null);
              return;
            }
            const obj = gltf.scene || gltf.scenes[0];
            // 替换：卸载 LOD0 中模 → 显示高模（先记住中模的居中平移量）
            const prevPos = firstLoaded ? firstLoaded.position.clone() : null;
            if (firstLoaded) { sceneHigh.remove(firstLoaded); disposeObject(firstLoaded); firstLoaded = null; }
            finish(obj);   // LOD0 已 resolve 进入详情，此路径仅后台替换，不再操作遮罩/进度
            showHiProgress(null);   // 高清就绪：隐藏顶部进度条
            setStatus('模型已加载（高清）', 'ok');       // 状态栏更新，不遮罩
            // 高模替换中模后的取景处理：新 obj 的 position 是默认值，未继承中模的居中平移，
            // 否则模型会偏离旋转中心、360° 观察不顺
            if (state.mode === Mode.DETAIL) {
              if (state.userTouched && prevPos) {
                obj.position.copy(prevPos);   // 用户已手动调整视角 → 继承中模居中平移，避免模型跳动
              } else {
                fitDetailView(obj);           // 未交互 → 重新精确取景（模型完整居中）
              }
            }
            console.log('[线上展厅] 已升级为高清模型 (LOD1):', device.model);
          }, e => {
            // 面板状态 + 顶部细进度条显示真实下载百分比（画面已进入，无全屏遮罩）
            if (e && e.total && state.mode === Mode.DETAIL && token === state.loadToken) {
              const pct = Math.round(e.loaded / e.total * 100);
              setStatus('加载 ' + device.name + '… ' + pct + '%', 'loading');
              showHiProgress(e.loaded / e.total);
            }
          }, () => {
            state.upgrading = false;
            showHiProgress(null);
            console.warn('[线上展厅] 高清模型失败' + (allowRetry ? '，重试一次' : ''));
            // 遮罩由 enterDetail 统一关闭，这里不操作
            if (allowRetry && token === state.loadToken) {
              // 网络抖动自动重试一次（PC 直载路径，避免"模型显示不出来"）
              setTimeout(() => loadHigh(false), 800);
            } else if (!firstLoaded) {
              resolve(null);   // 无缩略可保留 → 结束加载（防 Loading 卡死）
            }
          });
        };

        // 快路径：全景缩略已在内存 → 零下载直接作为 LOD0 显示（瞬时进入详情）
        if (borrowed) {
          borrowed.scale.set(1, 1, 1);        // 取消全景缩放(0.85)
          borrowed.position.set(0, 0, 0);     // 归零（fitDetailView 会重新居中取景）
          borrowed.rotation.set(0, 0, 0);
          firstLoaded = borrowed;
          setProgTarget(1);
          finish(borrowed);
          if (PERF.upgradeHigh) loadHigh(true);   // 后台升级高清（无感替换）
          return;
        }
        // 无借用缩略（全景未加载完就点击）：
        //  PC → 直接下载高清高模（一次到位，跳过 mobile 中转，避免 low→mid→high 重复下载）
        //  移动端 → 下载轻量 mobile（中模，够用且不崩）
        if (!PERF.upgradeHigh && thumbUrl) {
          // 移动端：下载轻量 mobile 作为详情模型（0.6-3MB 快，单份稳定不崩）
          loadGLB(ver(thumbUrl), gltf => {
            if (token !== state.loadToken) { resolve(null); return; }
            const obj = gltf.scene || gltf.scenes[0];
            firstLoaded = obj;
            setProgTarget(1);   // 就绪：进度平滑走到 100%
            finish(obj);
          }, e => {
            if (e && e.total && token === state.loadToken) {
              setProgText('加载 ' + device.name + '…');
              setProgTarget(e.loaded / e.total);
            }
          }, () => {
            resolve(null);   // 加载失败 → 结束（显示失败提示）
          });
        } else {
          // PC：直接下载高清高模（进度遮罩显示真实百分比，一次到位）
          loadHigh(true);
        }
      });
    }

    /* ================= 模式切换（核心状态机逻辑） ================= */
    async function enterDetail(i) {
      // 守卫：过渡中禁止新进入；已在详情且同一台设备则忽略
      if (state.mode === Mode.TRANSITION) return;
      if (state.mode === Mode.DETAIL && state.selectedIndex === i) return;

      const token = ++state.enterToken;
      state.mode = Mode.TRANSITION;
      state.selectedIndex = i;
      state.userTouched = false;   // 重置交互标志（新进入详情时高模就绪会重新取景）
      const device = state.devices[i];

      highlightInstance(i);
      syncSidebar(i);
      openPanel(device);            // 面板立即显示（参数来自 JSON，不依赖模型）
      rendererHigh.domElement.style.cursor = 'wait';

      // 若之前详情模式有模型 → 先卸载（切换到另一台设备时）
      unloadHighModel();

      stopProgressAnim();          // 终止上一轮动画（防残留）
      progCur = 0; progTarget = 0; // 每次进入从 0 开始
      setProgText('加载 ' + device.name + '…');
      setLoading(true, '飞入特写 · 加载 ' + device.name + '…', 0);
      setProgTarget(0.04);   // 起步目标，防卡 0%（真实进度到达后立即覆盖）
      const view = detailView(i);
      const flyP = flyTo(view.pos, view.tgt, 900);
      // 模型加载不阻塞进入：飞行结束立即进画面（借用缩略瞬时显示；下载中画面为空+面板显示百分比）
      const loadP = loadHighModel(device);

      await flyP;
      if (token !== state.enterToken) { unloadHighModel(); return; }  // 已被返回/切换打断

      // 立即进详情画面（不等待模型下载完成——避免慢网下卡加载遮罩 1 分钟）
      app.classList.add('blur');
      sceneHigh.background = new THREE.Color(0xb8bdc5);   // 详情亮灰背景（明亮清晰环境）
      stopProgressAnim();
      setLoading(false);
      rendererHigh.domElement.style.cursor = '';
      state.mode = Mode.DETAIL;
      document.body.classList.add('in-detail');   // 隐藏侧栏/分享，面板独占左下角
      releaseThumbnails();   // 归还全景缩略显存

      // 模型就绪后（借用=瞬时 / 下载=完成后）补充取景与状态
      loadP.then(model => {
        if (token !== state.enterToken) return;
        if (model) {
          fitDetailView(model);
          setStatus('模型已加载', 'ok');   // 高清升级完成时 loadHigh 会再置「已加载（高清）」
        } else {
          setStatus('模型加载失败（' + device.model + ' 不存在？）', 'err');
        }
      }).catch(() => {});
      console.log('[线上展厅] 进入详情模式:', device.name);
    }

    async function exitDetail() {
      // 允许在过渡中打断（用户点「返回」时可能仍在飞行/加载）
      if (state.mode === Mode.OVERVIEW) return;
      const token = ++state.exitToken;
      state.enterToken++;           // 使进行中的进入流程失效
      state.mode = Mode.TRANSITION;

      state.upgrading = false;   // 停止升级标记
      showHiProgress(null);      // 隐藏详情高模进度条
      stopProgressAnim();   // 停止详情进度动画
      setLoading(true, '返回全景…');
      rendererHigh.domElement.style.cursor = 'wait';

      unloadHighModel();            // ← 内存释放关键点
      closePanel();
      clearHighlight();
      syncSidebar(-1);
      app.classList.remove('blur');
      sceneHigh.background = null;   // 返回全景：清除详情背景（恢复透明叠加）

      const v = overviewView();
      await flyTo(v.pos, v.tgt, 900);
      if (token !== state.exitToken) return;
      unloadHighModel();            // 兜底：处理加载竞态残留的模型

      state.selectedIndex = -1;
      setLoading(false);
      rendererHigh.domElement.style.cursor = '';
      state.mode = Mode.OVERVIEW;
      controls.minDistance = 4;   // 返回全景：恢复全景缩放范围（详情模式由 fitDetailView 设置）
      controls.maxDistance = 80;
      document.body.classList.remove('in-detail');  // 恢复侧栏与分享按钮
      // 返回全景：从 IndexedDB 缓存快速重建缩略模型（IDB 命中秒回；失败保留立方体占位）
      if (!thumbObjects.length) {
        setTimeout(() => { loadThumbsFrom(0); }, 120);
      }
      console.log('[线上展厅] 返回全景模式');
    }

    // 特写取景：①模型居中（旋转中心=模型中心，触控流畅的关键）
    //          ②相机/目标点同步平移 + 距离适配
    // 用 boxExcl：LOGO 打标后仍显示，但不参与取景（避免其远离主体时拉偏旋转中心）
    function fitDetailView(obj) {
      const box = boxExcl(obj);
      if (box.isEmpty()) return;
      const center = box.getCenter(new THREE.Vector3());
      // 1) 模型居中：把包围盒中心平移到 (0, 0.3, 0)，让旋转轴对准模型中心
      obj.position.add(new THREE.Vector3(-center.x, 0.3 - center.y, -center.z));
      box.copy(boxExcl(obj));
      const r = box.getBoundingSphere(new THREE.Sphere()).radius;
      const want = Math.max(r / Math.tan((camera.fov * Math.PI) / 360) * 1.15, r * 2);
      // 2) 目标点归位到模型中心，相机同步平移保持相对位置
      const oldT = controls.target.clone();
      controls.target.set(0, 0.3, 0);
      camera.position.add(controls.target.clone().sub(oldT));
      // 3) 距离适配
      const dir = camera.position.clone().sub(controls.target);
      const cur = dir.length();
      if (Math.abs(want - cur) > 0.05) {
        dir.normalize().multiplyScalar(want);
        camera.position.copy(controls.target).add(dir);
      }
      // 深度精度优化：near/far 比从 ~2.5万收紧到 ~2000 内（且 near 恒小于最近缩放距离），
      // 大幅提升深度缓冲精度，消除大模型(整线)薄件间 Z-fighting 穿模
      camera.near = Math.max(r * 0.002, want * 0.002);
      camera.far = want * 3.2;
      camera.updateProjectionMatrix();
      controls.minDistance = r * 0.1;
      controls.maxDistance = r * 20;
      controls.update();
    }

    /* ================= 点击拾取（Raycaster → instanceId） ================= */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downPos = null;
    rendererHigh.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
    // 双击定点放大：命中模型处 → 目标点移到该处并拉近；双击空白 → 回到模型整体
    rendererHigh.domElement.addEventListener('dblclick', e => {
      if (state.mode !== Mode.DETAIL || !state.highModel) return;
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(state.highModel, true);
      if (hits.length) {
        controls.target.copy(hits[0].point);   // 定点：旋转/放大中心移到命中处
        controls.dollyIn(1.35);                // 拉近一级
      } else {
        // 双击空白：回到模型整体视角（fitDetailView 重定位，排除 LOGO）
        const c = boxExcl(state.highModel).getCenter(new THREE.Vector3());
        controls.target.set(c.x, c.y, c.z);
      }
    });
    rendererHigh.domElement.addEventListener('pointerup', e => {
      if (!downPos) return;
      const dx = e.clientX - downPos[0], dy = e.clientY - downPos[1];
      downPos = null;
      if (dx * dx + dy * dy > 36) return;   // 拖拽旋转不算点击
      if (state.mode === Mode.TRANSITION) return;
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects([bodyMesh, baseMesh, ...labels, ...thumbObjects], false);
      if (!hits.length) return;
      const h = hits[0];
      const id = h.object.isInstancedMesh ? h.instanceId : h.object.userData.deviceId;
      if (id == null) return;
      if (state.mode === Mode.DETAIL && state.selectedIndex === id) return;
      enterDetail(id);
    });

    /* ================= 设备列表（侧栏，与 3D 拾取双入口） ================= */
    function syncSidebar(i) {
      document.querySelectorAll('.device-tile').forEach((t, k) => {
        t.classList.toggle('active', k === i);
      });
    }
    function renderSidebar() {
      const list = document.getElementById('device-list');
      list.innerHTML = '';
      state.devices.forEach((d, i) => {
        const tile = document.createElement('div');
        tile.className = 'device-tile';
        tile.innerHTML = '<div class="dname">' + esc(d.name) + '</div><div class="dnum">#' + (i + 1) + '</div>';
        tile.addEventListener('click', () => enterDetail(i));
        list.appendChild(tile);
      });
    }

    /* ================= 初始化：读 models.json → 构建全景 ================= */
    async function init() {
      try {
        setLoading(true, '初始化中…', 0.08);
        const r = await fetch('./models.json', { cache: 'no-store' });
        const data = await r.json();
        state.devices = data.devices || [];
        if (!state.devices.length) { showFatal('models.json 中没有设备'); return; }
        setLoading(true, '构建展厅…', 0.18);
        renderSidebar();
        state.devices.forEach((d, i) => makeLabel(d.name, i));
        // 首屏提速：数据就绪立即进入全景（不等待任何缩略模型下载）；
        // 缩略模型全部在后台逐台加载，加载完成一台替换一个立方体（立即可见占位+标签可交互）
        setLoading(true, '进入展厅…', 0.6);
        setTimeout(() => {
          loadThumbsFrom(0);
        }, 50);
        setLoading(false);
        console.log('[线上展厅] 全景就绪，缩略模型后台加载中');
      } catch (e) {
        console.error(e);
        showFatal('models.json 加载失败：' + e.message);
      }
    }

    /* ================= lil-gui 控制面板 ================= */
    const params = {
      autoRotate: true, autoRotateSpeed: 0.6,
      bloom: false, bloomStrength: 0.1, fogFar: 120, showFPS: false,
      exposure: 1.8, envIntensity: 0.7, hdrBackground: false,
      resetView: () => {
        if (state.mode === Mode.DETAIL && state.selectedIndex >= 0) {
          const v = detailView(state.selectedIndex);
          flyTo(v.pos, v.tgt, 700);
        } else {
          const v = overviewView();
          flyTo(v.pos, v.tgt, 700);
        }
      }
    };
    const gui = new GUI({ title: '控制面板' });
    gui.open();   // 控制面板始终展开显示内容（默认右上角）
    const vf = gui.addFolder('视图');
    vf.add(params, 'resetView').name('重置视角');
    vf.add(params, 'autoRotate').name('自动旋转').onChange(v => { controls.autoRotate = v; });
    vf.add(params, 'autoRotateSpeed', 0, 10, 0.1).name('旋转速度').onChange(v => { controls.autoRotateSpeed = v; });
    const rf = gui.addFolder('渲染');
    // 仅保留曝光（其余渲染参数用代码默认值，不暴露给用户）
    rf.add(params, 'exposure', 0.5, 5, 0.05).name('曝光').onChange(v => { rendererLow.toneMappingExposure = 0.85; rendererHigh.toneMappingExposure = v; });
    vf.open(); rf.open();

    /* ================= 显式应用默认参数（防缓存/时序问题，打开即生效） ================= */
    // 默认最大雾化距离（far=120，滑条上限）+ 最小曝光（0.5，滑条下限）
    sceneLow.fog.near = 30;
    sceneLow.fog.far = params.fogFar;
    rendererLow.toneMappingExposure = 0.85;   // 展厅：明亮
    rendererHigh.toneMappingExposure = params.exposure;   // 详情：保持现在设置
    setEnvIntensity(params.envIntensity);   // 默认环境强度：大厅 0.1（柔和），详情 ≥1.5（防黑）
    console.log('[线上展厅] 默认参数已应用: 雾化距离=' + sceneLow.fog.far + ' 曝光=' + params.exposure + ' (NAIGU EXPO V1.5)');

    /* ================= 后处理：辉光通道（仅全景底层，极克制防过曝） ================= */
    // UnrealBloomPass：strength 0.15（极弱光晕）/ radius 0.4 / threshold 1.0（仅超亮处发光）
    // 避免发光部分过曝导致模型本体看不清；分辨率取屏幕一半兼顾移动端
    const composer = new EffectComposer(rendererLow);
    composer.addPass(new RenderPass(sceneLow, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(Math.floor(innerWidth / 2), Math.floor(innerHeight / 2)),
      0.1, 0.4, 0.8   // 展厅辉光 0.1（克制，控制面板可调）
    );
    composer.addPass(bloomPass);
    bloomPass.enabled = false;   // 取消辉光（gui 可手动开启）

    /* ================= FPS 统计（性能测试用） ================= */
    let fpsEl = null, fpsFrames = 0, fpsLast = performance.now();
    function updateFPS(now) {
      fpsFrames++;
      if (now - fpsLast >= 500) {
        const fps = Math.round(fpsFrames * 1000 / (now - fpsLast));
        fpsFrames = 0; fpsLast = now;
        if (fpsEl) fpsEl.textContent = 'FPS: ' + fps;
      }
    }

    /* ================= 渲染循环 / 自适应 / 快捷键 ================= */
    rendererLow.setAnimationLoop(() => {
      controls.update();
      composer.render();                                  // 全景（含辉光后处理）
      rendererHigh.render(sceneHigh, camera);             // 详情高模（无后处理，保持清晰）
      updateFPS(performance.now());
    });
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      rendererLow.setSize(innerWidth, innerHeight);
      rendererHigh.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloomPass.resolution.set(Math.floor(innerWidth / 2), Math.floor(innerHeight / 2));
    });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && state.mode === Mode.DETAIL) exitDetail();
    });
    document.getElementById('back-btn').addEventListener('click', exitDetail);
    document.getElementById('lobby-btn').addEventListener('click', exitDetail);

    /* ================= 分享：公网链接 + 二维码（微信扫码打开） ================= */
    // 公网正式地址（CloudBase 静态托管，自动部署，微信/手机可打开）
    // 本地访问（localhost）时自动替换为该地址，避免把 localhost 发给别人打不开
    const PUBLIC_URL = 'https://baigukeji-d6g7omgxc78b09a62-1469467156.tcloudbaseapp.com/';
    function isLocalUrl(url) {
      return /localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|192\.168\.|^https?:\/\/10\.|^https?:\/\/172\.(1[6-9]|2\d|3[01])\./i.test(url);
    }
    function getShareUrl() {
      const cur = location.href;
      return isLocalUrl(cur) ? PUBLIC_URL : cur;
    }
    // 二维码库加载（本地优先，CDN 回退）
    function loadQR(cb) {
      if (window.QRCode) return cb(window.QRCode);
      const urls = [
        './lib/qrcode.min.js',
        'https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.js',
        'https://registry.npmmirror.com/qrcode/latest/files/build/qrcode.js',
        'https://unpkg.com/qrcode/build/qrcode.js'
      ];
      let i = 0;
      (function next() {
        if (i >= urls.length) return cb(null);
        const s = document.createElement('script');
        s.src = urls[i++];
        s.onload = () => (window.QRCode ? cb(window.QRCode) : next());
        s.onerror = next;
        document.head.appendChild(s);
      })();
    }
    function refreshSharePanel() {
      const url = getShareUrl();
      const input = document.getElementById('share-url');
      const note = document.getElementById('share-note');
      input.value = url;
      note.textContent = isLocalUrl(location.href)
        ? '当前是本地地址，已自动替换为公网链接（微信可打开）'
        : '微信/手机扫码即可打开本页面';
      loadQR(QR => {
        const qr = document.getElementById('share-qr');
        if (QR) {
          try { QR.toCanvas(qr, url, { width: 180, margin: 1, errorCorrectionLevel: 'M' }); }
          catch (e) { note.textContent = '二维码生成失败，请直接复制链接发送。'; }
        } else {
          note.textContent = '二维码组件加载失败（可能离线），请直接复制链接发送。';
        }
      });
    }
    const sharePanel = document.getElementById('share-panel');
    document.getElementById('share-btn').addEventListener('click', () => {
      const show = sharePanel.classList.toggle('show');
      if (show) refreshSharePanel();
    });
    document.getElementById('share-copy').addEventListener('click', () => {
      const input = document.getElementById('share-url');
      const url = input.value;
      if (!url) return;
      const done = () => { const b = document.getElementById('share-copy'); b.textContent = '✓ 已复制'; setTimeout(() => b.textContent = '复制', 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done);
      else { input.select(); document.execCommand('copy'); done(); }
    });

    // 启动：全景视角就位后渲染设备全景
    const v0 = overviewView();
    camera.position.copy(v0.pos);
    controls.target.copy(v0.tgt);
    controls.minDistance = 4;
    controls.maxDistance = 80;   // 展台半径 15，允许拉远俯瞰全景
    controls.autoRotate = true;  // 自动旋转默认开启（gui 可关）
    controls.autoRotateSpeed = 0.6;  // 慢速旋转（约 3.6°/秒），先看清前排再缓缓展示
    controls.update();
    init();
  </script>
</body>
