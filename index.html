<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- NAIGU EXPO V1.5: fogFar=120 exposure=0.5 no-wireframe -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鑰愰敘绉戞妧绾夸笂灞曞巺</title>
  <!-- 姝ｅ紡 Logo favicon锛坙ogo2.png 鐢熸垚锛岀増鏈彿寮哄埗鍒锋柊缂撳瓨锛?-->
  <link rel="icon" type="image/png" href="favicon.png?v=20260823" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260823" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #10131a;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #app { position: fixed; inset: 0; }

    /* 鍙屽眰鐢诲竷锛氬簳灞?鍏ㄦ櫙浣庢ā鍦烘櫙锛岄《灞?璇︽儏楂樼簿搴︽ā鍨嬶紙閫忔槑锛?*/
    #app canvas { position: absolute; inset: 0; display: block; }
    #low-canvas  { z-index: 1; pointer-events: none; transition: filter .7s ease, transform .7s ease; }
    #high-canvas { z-index: 2; pointer-events: auto; }
    /* 鑳屾櫙铏氬寲锛氳鎯呮ā寮忎笅搴曞眰鍏ㄦ櫙鍙樻ā绯婏紝鑱氱劍鐗瑰啓妯″瀷锛堟繁钃濈伆鑳屾櫙淇濇寔鍘熶寒搴︼級 */
    #app.blur #low-canvas {
      filter: blur(12px) brightness(.9);
      transform: scale(1.06);
    }

    /* ========== 璇︽儏鍙傛暟闈㈡澘锛堝乏涓嬭锛岄伩寮€鍙充笂瑙?lil-gui 鎺у埗闈㈡澘锛?========== */
    #detail-panel {
      position: fixed; z-index: 12;
      left: 16px; bottom: 16px; width: 300px;
      background: rgba(16,20,30,.88); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
      padding: 18px; color: #e8ecf4;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      transform: translateX(-24px); opacity: 0; pointer-events: none;
      transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s;
    }
    #detail-panel.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
    /* 鏀惰捣鐘舵€侊細闈㈡澘婊戝嚭灞忓箷锛堟ā鍨嬩笉琚伄鎸★級 */
    #detail-panel.collapsed { transform: translateX(-130%); opacity: 0; pointer-events: none; }
    #detail-panel .dp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #detail-panel .dp-name { font-size: 19px; font-weight: 700; flex: 1; min-width: 0; line-height: 1.35; word-break: break-all; }
    #dp-collapse {
      background: rgba(255,255,255,.08); color: #aab4c8; border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; line-height: 1;
      flex: none; transition: background .2s, color .2s;
    }
    #dp-collapse:hover { background: rgba(255,255,255,.16); color: #fff; }
    #detail-panel .dp-desc  { color: rgba(232,236,244,.6); font-size: 12px; margin: 6px 0 14px; line-height: 1.6; }
    #detail-panel table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    #detail-panel td { font-size: 12.5px; padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,.07); }
    #detail-panel td:first-child { color: rgba(232,236,244,.5); width: 38%; }
    #detail-panel td:last-child { text-align: right; color: #9fc6ff; }
    #detail-panel .dp-status { font-size: 11.5px; margin-bottom: 14px; min-height: 16px; }
    #detail-panel .dp-status.ok  { color: #5fd08a; }
    #detail-panel .dp-status.err { color: #ff7a7a; }
    #detail-panel .dp-status.loading { color: #ffc46b; }
    /* 鏀惰捣鍚庣殑杩蜂綘鏍囩鏉★紙鐐瑰嚮灞曞紑锛屼綅浜庡乏涓嬭涓庨潰鏉垮悓浣嶇疆锛?*/
    #dp-mini {
      position: fixed; left: 16px; bottom: 16px; z-index: 12;
      background: rgba(61,108,255,.9); color: #fff;
      border-radius: 18px; padding: 8px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      transition: background .2s, transform .15s;
    }
    #dp-mini:hover { background: #2f58d6; }
    #dp-mini:active { transform: scale(.95); }
    #dp-mini.hidden { display: none; }
    #back-btn {
      width: 100%; padding: 10px; border: none; border-radius: 9px; cursor: pointer;
      background: linear-gradient(90deg, #2e5bff, #5a3dff); color: #fff; font-size: 14px; font-weight: 600;
      letter-spacing: 2px; transition: filter .2s, transform .1s;
    }
    #back-btn:hover { filter: brightness(1.15); }
    #back-btn:active { transform: scale(.97); }
    @media (max-width: 768px) {
      #detail-panel { top: auto; bottom: 12px; right: 10px; left: 10px; width: auto; transform: translateY(16px); }
      #detail-panel.show { transform: translateY(0); }
      #detail-panel.collapsed { transform: translateY(130%); }
      #dp-mini { top: auto; left: 50%; bottom: 12px; transform: translateX(-50%); }
    }
    /* 璇︽儏妯″紡锛氫晶鏍忔粦鍑洪殣钘忥紙闈㈡澘鏀惧乏涓嬭涓嶈閬尅锛夛紝鍒嗕韩鎸夐挳闅愯棌 */
    #device-panel { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
    body.in-detail #device-panel { transform: translateX(-100%); }
    body.in-detail #share-btn { opacity: 0; pointer-events: none; }

    /* ========== 甯搁┗銆岃繑鍥炲ぇ鍘呫€嶆寜閽紙璇︽儏妯″紡鏄剧ず锛屼笉闅忛潰鏉挎姌鍙狅級 ========== */
    #lobby-btn {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-70px);
      z-index: 20; padding: 9px 24px; border: 1px solid rgba(255,255,255,.22); border-radius: 22px;
      background: rgba(20,26,40,.85); backdrop-filter: blur(8px);
      color: #fff; font-size: 13.5px; font-weight: 600; letter-spacing: 3px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,.4); transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s, background .2s;
      opacity: 0; pointer-events: none;
    }
    #lobby-btn:hover { background: rgba(46,91,255,.92); }
    #lobby-btn:active { transform: translateX(-50%) translateY(0) scale(.96); }
    body.in-detail #lobby-btn { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    @media (max-width: 768px) {
      body.in-detail #device-panel { transform: translateY(100%); }
      /* 鎵嬫満绔細杩斿洖澶у巺鍥哄畾鍦ㄥ乏涓婅锛堝彸涓婅涓烘帶鍒堕潰鏉匡紝涓ゅ尯浜掍笉閲嶅彔锛?*/
      #lobby-btn { left: 12px; transform: translateX(-12px) translateY(-70px); }
      #lobby-btn:hover { background: rgba(46,91,255,.92); }
      #lobby-btn:active { transform: translateX(-12px) translateY(0) scale(.96); }
      body.in-detail #lobby-btn { transform: translateX(0) translateY(0); }
      /* 鎺у埗闈㈡澘淇濇寔 lil-gui 榛樿鍙充笂瑙掍綅缃紝涓嶅仛绔栨斁/鏀惰捣瑕嗙洊锛堥伩鍏嶅唴瀹瑰紓甯革級 */
    }

    /* ========== 璁惧鍒楄〃锛堟闈㈠乏渚ф爮 / 鎵嬫満搴曢儴妯潯锛?========== */
    #device-panel {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
      width: 210px;
      background: rgba(14,18,26,.8); backdrop-filter: blur(8px);
      border-right: 1px solid rgba(255,255,255,.08);
      display: flex; flex-direction: column;
    }
    #device-panel h3 { color: #c9d2e0; font-size: 14px; font-weight: 600; padding: 14px 14px 10px; }
    /* 鍝佺墝锛堝乏涓婅锛氭寮?Logo 鍥剧墖 + 鍏徃鍚嶏級 */
    #brand {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 14px 4px;
      height: 44px;                      /* 涓庝晶鏍忔爣棰樿楂樹竴鑷达紝鍨傜洿灞呬腑 */
      box-sizing: content-box;
    }
    .logo-img { height: 26px; width: auto; flex: none; }   /* 姝ｅ紡 Logo 鍥剧墖 */
    .logo-text {
      color: #2b2b2b; font-size: 15px; font-weight: 700;        /* 娣辩伆榛戠矖浣?*/
      font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
      letter-spacing: 1px; white-space: nowrap;
    }
    @media (max-width: 768px) { #brand { display: none; } }
    #device-list { flex: 1; overflow-y: auto; padding: 0 10px 14px; }
    .device-tile {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
      border-radius: 9px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .device-tile:hover { background: rgba(255,255,255,.09); }
    .device-tile.active { border-color: #3d6cff; background: rgba(61,108,255,.15); }
    .device-tile .dname { color: #e4e9f2; font-size: 12.5px; font-weight: 600; }
    .device-tile .dnum  { color: rgba(228,233,242,.4); font-size: 10.5px; margin-top: 2px; }
    @media (max-width: 768px) {
      #device-panel {
        top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: 88px;
        border-right: none; border-top: 1px solid rgba(255,255,255,.08);
      }
      #device-panel h3 { display: none; }
      #device-list { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; overflow-y: hidden; }
      .device-tile { flex: 0 0 auto; min-width: 72px; max-width: 132px; margin-bottom: 0; padding: 6px; text-align: center; }
      .device-tile .dname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    }

    #share-btn {
      position: fixed; right: 14px; bottom: 14px; z-index: 15; pointer-events: auto;
      background: rgba(43,48,59,.85); color: #e8eaf0; border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px; padding: 7px 14px; cursor: pointer; font-size: 12px;
    }
    #share-btn:hover { background: #3a4150; }
    @media (max-width: 768px) { #share-btn { bottom: 96px; } }

    /* 鍒嗕韩闈㈡澘锛堥摼鎺?+ 浜岀淮鐮侊紝寰俊鎵爜鎵撳紑锛?*/
    #share-panel {
      position: fixed; right: 14px; bottom: 52px; z-index: 16;
      width: 240px;
      background: rgba(16,20,30,.94); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
      padding: 14px; color: #e8ecf4;
      box-shadow: 0 10px 34px rgba(0,0,0,.5);
      opacity: 0; transform: translateY(10px); pointer-events: none;
      transition: opacity .3s, transform .3s;
    }
    #share-panel.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #share-panel .sp-head { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    #share-panel .sp-url-row { display: flex; gap: 6px; margin-bottom: 12px; }
    #share-panel #share-url {
      flex: 1; min-width: 0; background: rgba(255,255,255,.07); color: #cfe0ff;
      border: 1px solid rgba(255,255,255,.12); border-radius: 6px;
      padding: 6px 8px; font-size: 11px; outline: none;
    }
    #share-panel #share-copy {
      background: #3d6cff; color: #fff; border: none; border-radius: 6px;
      padding: 6px 10px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    #share-panel #share-copy:hover { background: #2f58d6; }
    #share-panel .sp-qr-wrap { display: flex; justify-content: center; margin-bottom: 8px; }
    #share-panel #share-qr { background: #fff; border-radius: 8px; width: 180px; height: 180px; }
    #share-panel #share-note {
      color: rgba(232,236,244,.6); font-size: 11px; line-height: 1.6; text-align: center;
    }
    @media (max-width: 768px) { #share-panel { bottom: 132px; right: 10px; } }

    /* ========== 鍔犺浇閬僵锛堣繘搴︽潯锛涗笉閫忔槑锛屽垏鎹㈡椂閬垮厤闂儊锛?========== */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 30;
      background: #10131a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      transition: opacity .35s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.15); border-top-color: #4da3ff;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: #e8eaf0; font-size: 14px; }
    .progress-wrap { width: 240px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #4da3ff, #7c6bff); transition: width .2s; }
    #progress-pct { color: #9fc6ff; font-size: 14px; font-weight: 700; letter-spacing: 1px; min-width: 52px; text-align: center; }
    #loading-overlay.error .spinner { border-top-color: #ff6b6b; }
    #loading-overlay.error #loading-text { color: #ff6b6b; }

    .lg { z-index: 5 !important; }
  </style>
  <!-- 鍏煎鎬ф娴嬶紙鎵€鏈夋祻瑙堝櫒閮戒細鎵ц锛屾棭浜?module 鑴氭湰锛夛細
       鏂扮増寰俊锛圕hromium 鍐呮牳锛夋敮鎸?WebGL/ES module 鈫?鐩存帴鏄剧ず 3D锛?
       浠呭綋鍐呮牳涓嶆敮鎸侊紙鑰佸井淇?鏃?WebGL锛夋椂鏄剧ず寮曞灞?-->
  <script>
    (function () {
      try {
        var isWeChat = /MicroMessenger/i.test(navigator.userAgent);
        var supportsModules = 'noModule' in document.createElement('script');
        var cv = document.createElement('canvas');
        var supportsWebGL = !!(window.WebGLRenderingContext && (cv.getContext('webgl') || cv.getContext('experimental-webgl')));
        function addLayer(innerHTML) {
          var layer = document.createElement('div');
          layer.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#f5f7fa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:"Microsoft YaHei",sans-serif;text-align:center;padding:24px;';
          layer.innerHTML = innerHTML;
          var mount = function () { (document.body || document.documentElement).appendChild(layer); };
          if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
        }
        var issues = [];
        if (!supportsModules) issues.push('褰撳墠娴忚鍣ㄧ増鏈繃鏃э紙涓嶆敮鎸?3D 椤甸潰鍔犺浇锛?);
        if (!supportsWebGL) issues.push('WebGL 3D 娓叉煋涓嶅彲鐢?);
        if (issues.length) {
          // 鍐呮牳涓嶆敮鎸侊細寮曞鐢ㄧ郴缁熸祻瑙堝櫒鎵撳紑锛堝井淇″唴涔熼€傜敤锛?
          addLayer(
            '<div style="font-size:18px;font-weight:600;color:#1f2937;">鏃犳硶鏄剧ず 3D 灞曞巺</div>' +
            '<div style="font-size:14px;color:#6b7280;">' + issues.join('锛?) + '</div>' +
            '<div style="font-size:13px;color:#6b7280;line-height:1.9;">' +
            (isWeChat
              ? '璇风偣鍑诲彸涓婅銆屄仿仿枫€嶁啋 閫夋嫨銆屽湪娴忚鍣ㄤ腑鎵撳紑銆?br>浣跨敤 Chrome / Safari 鎵撳紑鍗冲彲姝ｅ父娴忚'
              : '璇蜂娇鐢ㄦ渶鏂扮増 Chrome / Safari / Edge 娴忚鍣ㄦ墦寮€') +
            '</div>'
          );
          return;
        }
        // 寰俊鍐呬笖鍐呮牳鍙敤锛氱洿鎺ユ樉绀?3D锛堟棤椤堕儴鎻愮ず鏉★紝淇濇寔鐢婚潰骞插噣锛?
      } catch (e) { /* 妫€娴嬪け璐ヤ笉闃诲椤甸潰 */ }
    })();
  </script>
</head>

  <div id="device-panel">
    <div id="brand"><img class="logo-img" src="logo2.png" alt="鑰愰敘绉戞妧" /><span class="logo-text">鑰愰敘绉戞妧</span></div>

  <script type="module">
    /* ============================================================
     *  鑰愰敘绉戞妧绾夸笂灞曞巺锛?D 璁惧灞傜骇涓嬮捇灞曠ず锛?
     *  鐘舵€佹満锛歄VERVIEW(鍏ㄦ櫙) -> TRANSITION(椋炶/鍔犺浇) -> DETAIL(璇︽儏)
     *          DETAIL -> TRANSITION -> OVERVIEW锛堣繑鍥烇級
     *  鍐呭瓨绠＄悊锛氬叏鏅綆妯?= 甯搁┗ InstancedMesh锛堝叡浜嚑浣曚綋/鏉愯川锛屾案涓嶉噸寤猴級
     *            璇︽儏楂樻ā = 鎸夐渶鍔犺浇锛岃繑鍥炴椂閫掑綊閲婃斁 geometry/material/texture
     * ============================================================ */
    const overlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const progressBar = document.getElementById('progress-bar');
    const progressPct = document.getElementById('progress-pct');

    /* ============ PC / 绉诲姩绔€ц兘鍒嗙骇锛堝叏灞€锛?============
     * isMobile锛歎A 鎴栧睆骞曞搴?<768px 鍒ゅ畾
     * PERF 鍒嗙骇鍙傛暟锛氬儚绱犳瘮 / 鎶楅敮榻?/ 闃村奖 / 璇︽儏鏄惁鍗囩骇楂樻ā / 鏉愯川闄嶇骇
     */
    const isMobile = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(navigator.userAgent)
      || innerWidth < 768;
    const PERF = isMobile ? {
      pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),  // 绉诲姩绔?鈮?.5
      antialias: false,                                         // 绉诲姩绔叧鎶楅敮榻?
      shadows: false,                                           // 绉诲姩绔叧闃村奖
      upgradeHigh: false,                                       // 绉诲姩绔鎯呭彧鐢ㄤ綆妯?缂╃暐)
      downgradeMaterial: true                                   // 绉诲姩绔?PBR鈫扨hong
    } : {
      pixelRatio: window.devicePixelRatio || 1.5,               // PC锛氬畬鍏ㄤ娇鐢ㄨ澶囧儚绱犳瘮锛堥€氬父1.5~2.0锛夛紝缁濅笉闄愪负1
      antialias: true,                                          // PC 寮€鎶楅敮榻?
      shadows: true,                                            // PC 寮€闃村奖
      upgradeHigh: true,                                        // PC 鍗囩骇楂樻竻锛堢粏鑺傚叏淇濈暀锛?
      downgradeMaterial: false
    };
    // 鍏煎鏃у紩鐢細isMobile 宸插叏灞€鍖栵紙涓嬫柟鍚勫嚱鏁扮洿鎺ョ敤锛?

    // 妯″瀷璧勬簮鐗堟湰鍙凤細浠呭湪妯″瀷/缂╃暐鍥炬枃浠跺唴瀹规洿鏂版椂閫掑锛?
    // 椤甸潰閫昏緫鏀瑰姩锛圲I/鎬ц兘锛変笉閫掑 鈫?宸蹭笅杞界殑 glb 鍛戒腑娴忚鍣ㄧ紦瀛橈紝閬垮厤姣忔鏀圭増閮介噸涓嬪嚑鍗?MB
    const MODEL_VER = 34;
    const ver = (url) => url + (url.includes('?') ? '&' : '?') + 'v=' + MODEL_VER;

    function showFatal(msg) {
      overlay.classList.remove('hidden');
      overlay.classList.add('error');
      loadingText.textContent = '鍔犺浇澶辫触锛? + msg;
      progressBar.style.width = '100%';
    }

    // ---------- 鍔犺浇 three.js锛堟湰鍦颁紭鍏堬紝CDN 鍥為€€锛?----------
    let THREE, OrbitControls, GLTFLoader, GUI, EffectComposer, RenderPass, UnrealBloomPass, RGBELoader, RoomEnvironment, DRACOLoader, RectAreaLightUniformsLib;
    try {
      THREE = await import('./lib/three.module.js');
      OrbitControls = (await import('./lib/OrbitControls.js')).OrbitControls;
      GLTFLoader = (await import('./lib/GLTFLoader.js')).GLTFLoader;
      GUI = (await import('./lib/lil-gui.esm.min.js')).default;
      RGBELoader = (await import('./lib/RGBELoader.js')).RGBELoader;
      RoomEnvironment = (await import('./lib/environments/RoomEnvironment.js')).RoomEnvironment;
      DRACOLoader = (await import('./lib/DRACOLoader.js')).DRACOLoader;
      RectAreaLightUniformsLib = (await import('./lib/RectAreaLightUniformsLib.js')).RectAreaLightUniformsLib;
      RectAreaLightUniformsLib.init();   // 鏌斿厜绠憋紙RectAreaLight锛夌潃鑹插櫒鍒濆鍖?
      // 鍚庡鐞嗭紙杈夊厜閫氶亾锛夛細EffectComposer + RenderPass + UnrealBloomPass
      EffectComposer = (await import('./lib/postprocessing/EffectComposer.js')).EffectComposer;
      RenderPass = (await import('./lib/postprocessing/RenderPass.js')).RenderPass;
      UnrealBloomPass = (await import('./lib/postprocessing/UnrealBloomPass.js')).UnrealBloomPass;
      console.log('[绾夸笂灞曞巺] 浣跨敤鏈湴渚濊禆');
    } catch (e) {
      console.warn('[绾夸笂灞曞巺] 鏈湴渚濊禆涓嶅彲鐢紝灏濊瘯 CDN', e);
      let ok = false;
      for (const cdn of window.__CDNS) {
        try {
          __injectImportMap(cdn);
          THREE = await import('three');
          OrbitControls = (await import('three/addons/controls/OrbitControls.js')).OrbitControls;
          GLTFLoader = (await import('three/addons/loaders/GLTFLoader.js')).GLTFLoader;
          GUI = (await import(cdn.gui)).default;
          EffectComposer = (await import('three/addons/postprocessing/EffectComposer.js')).EffectComposer;
          RenderPass = (await import('three/addons/postprocessing/RenderPass.js')).RenderPass;
          UnrealBloomPass = (await import('three/addons/postprocessing/UnrealBloomPass.js')).UnrealBloomPass;
          RGBELoader = (await import('three/addons/loaders/RGBELoader.js')).RGBELoader;
          RoomEnvironment = (await import('three/addons/environments/RoomEnvironment.js')).RoomEnvironment;
          DRACOLoader = (await import('three/addons/loaders/DRACOLoader.js')).DRACOLoader;
          RectAreaLightUniformsLib = (await import('three/addons/lights/RectAreaLightUniformsLib.js')).RectAreaLightUniformsLib;
          RectAreaLightUniformsLib.init();
          console.log('[绾夸笂灞曞巺] 浣跨敤 CDN:', cdn.name);
          ok = true;
          break;
        } catch (e2) { console.warn('CDN 澶辫触', cdn.name, e2); }
      }
      if (!ok) { showFatal('3D 寮曟搸鍔犺浇澶辫触锛岃妫€鏌ョ綉缁滃悗鍒锋柊'); throw new Error('no engine'); }
    }

    /* ================= 鐘舵€佹満 ================= */
    const Mode = Object.freeze({ OVERVIEW: 0, TRANSITION: 1, DETAIL: 2 });
    const state = {
      mode: Mode.OVERVIEW,   // 褰撳墠鍦烘櫙妯″紡
      devices: [],           // models.json 鐨勮澶囧垪琛?
      selectedIndex: -1,     // 褰撳墠閫変腑鐨勮澶囦笅鏍囷紙-1 = 鏈€変腑锛?
      highModel: null,       // 褰撳墠璇︽儏妯″紡鐨勯珮绮惧害妯″瀷锛堝彲鍗歌浇锛?
      loadToken: 0,          // 绔炴€佷护鐗岋細鏂板姞杞戒娇鏃у姞杞藉け鏁?
      enterToken: 0,         // 杩涘叆娴佺▼浠ょ墝锛氳繑鍥?鍒囨崲浼氫娇鍏跺け鏁?
      exitToken: 0,          // 閫€鍑烘祦绋嬩护鐗?
      userTouched: false,    // 鐢ㄦ埛鏄惁宸叉墜鍔ㄦ棆杞?缂╂斁璇︽儏鐩告満锛堥珮妯℃浛鎹㈠悗涓嶅啀寮哄埗閲嶇疆瑙嗚锛?
    };

    /* ================= 鍙屽眰娓叉煋鍣紙PC/绉诲姩绔垎绾э級 ================= */
    const app = document.getElementById('app');
    function makeRenderer(alpha, id) {
      let r;
      try { r = new THREE.WebGLRenderer({ antialias: PERF.antialias, alpha, powerPreference: 'high-performance' }); }
      catch (e1) {
        try { r = new THREE.WebGLRenderer({ antialias: false, alpha }); }
        catch (e2) { showFatal('WebGL 涓嶅彲鐢?); throw e2; }
      }
      r.setPixelRatio(PERF.pixelRatio);   // PC鈮? / 绉诲姩鈮?.5锛堟寜 PERF 鍒嗙骇锛?
      r.setSize(innerWidth, innerHeight);
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;   // 鐢靛奖绾ц壊璋冩槧灏?
      r.toneMappingExposure = 1.0;
      // 闃村奖锛歅C 寮€鍚紱绉诲姩绔叧闂紙鏄捐憲闄嶄綆 GPU 鍘嬪姏锛?
      r.shadowMap.enabled = PERF.shadows;
      if (PERF.shadows) r.shadowMap.type = THREE.PCFSoftShadowMap;
      r.domElement.id = id;
      app.appendChild(r.domElement);
      return r;
    }
    // 搴曞眰锛氬叏鏅綆妯″満鏅紙鑳屾櫙涓嶉€忔槑锛屽彲琚?CSS 铏氬寲锛?
    const rendererLow = makeRenderer(false, 'low-canvas');
    // 椤跺眰锛氳鎯呴珮绮惧害妯″瀷锛堥€忔槑鑳屾櫙锛屽彔鍔犲湪搴曞眰涓婃柟锛?
    const rendererHigh = makeRenderer(true, 'high-canvas');
    // WebGL 宕╂簝闃叉姢锛歝ontext lost 鏃朵紭闆呴檷杞斤紙鍗婂垎杈ㄧ巼+鎻愮ず锛夛紝閬垮厤鐩存帴宕╂簝閲嶈浇
    [rendererLow, rendererHigh].forEach(r => {
      r.domElement.addEventListener('webglcontextlost', e => {
        e.preventDefault();
        console.warn('[绾夸笂灞曞巺] WebGL context lost锛岄檷杞芥仮澶?);
        setTimeout(() => {
          try { r.setPixelRatio(1); r.setSize(innerWidth, innerHeight); } catch (err) {}
        }, 300);
      });
    });

    // 鍏变韩鐩告満 + 鎺у埗鍣紙浜や簰缁戝畾椤跺眰鐢诲竷锛?
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 2000);
    const controls = new OrbitControls(camera, rendererHigh.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.zoomToCursor = true;   // 婊氳疆浠ラ紶鏍囦綅缃负瀹氱偣鏀惧ぇ锛堢敤鎴蜂綋楠屼紭鍖栵級
    // 鐢ㄦ埛寮€濮嬫墜鍔ㄦ棆杞?缂╂斁 鈫?鏍囪宸蹭氦浜掞紙楂樻ā鏇挎崲鍚庝笉鍐嶅己鍒堕噸缃瑙掞紝灏婇噸鐢ㄦ埛褰撳墠瑙嗚锛?
    controls.addEventListener('start', () => { if (state.mode === Mode.DETAIL) state.userTouched = true; });

    /* ================= 鍏ㄦ櫙鍦烘櫙锛堜綆妯★紝甯搁┗锛夆€斺€?璧涘崥鏈嬪厠瑙嗚 ================= */

    // ---------- 鈶?鑳屾櫙绯荤粺锛堢函鑹插彲璋?+ 闆捐壊鑱斿姩锛岄粯璁ゆ贰钃濈伆鎽勫奖妫氾級 ----------
    function setupBackground(scene) {
      scene.background = new THREE.Color(0xa8adb5);   // 娣¤摑鐏拌儗鏅绾革紙gui 鍙皟锛?
      scene.fog = new THREE.Fog(0xcbd5e1, 30, 120);    // 闆捐壊涓庤儗鏅竴鑷达紱榛樿闆惧寲璺濈鏈€澶э紙杩?120锛?
    }

    // ---------- 鈶?鐏厜绯荤粺锛堥珮绔睍鍘咃細椤堕儴鏉″舰鐏?+ 涓績鑱氬厜 + 鍐风櫧楂樺姣旓級 ----------
    function setupLights(scene, renderer) {
      const lights = [];
      // 椤堕儴鏉″舰鐏紙鍐风櫧 RectAreaLight 瀹芥潯褰紝鏄庝寒椤跺厜锛?
      const strip = new THREE.RectAreaLight(0xeaf2ff, 6, 16, 2.5);
      strip.position.set(0, 13, 0);
      strip.lookAt(0, 0, 0);
      scene.add(strip);
      lights.push(strip);
      // 涓績鑱氬厜鐏紙鑱氱劍灞曞彴涓績锛屽喎鐧斤紝楂樺姣斿厜褰憋級
      const spot = new THREE.SpotLight(0xf0f7ff, 300, 120, 0.5, 0.35, 1.5);
      spot.position.set(0, 16, 4);
      spot.target.position.set(0, 0, 0);
      scene.add(spot, spot.target);
      lights.push(spot);
      if (renderer) {
        spot.castShadow = true;
        spot.shadow.mapSize.set(1024, 1024);
        spot.shadow.camera.fov = 60;
        spot.shadow.camera.near = 1;
        spot.shadow.camera.far = 80;
        spot.shadow.camera.updateProjectionMatrix();
        spot.shadow.bias = -0.0005;
      }
      // 鏋佸急鐜鍏夛紙鏆楀満锛屼繚涓績鑱氬厜鐨勯珮瀵规瘮锛?
      scene.add(new THREE.AmbientLight(0xffffff, 0.12));
      return { lights };
    }

    // ---------- 鈶?鍦伴潰绯荤粺锛堝弽鍏夊湴鏉匡細寰娓愬彉 + 楂樺弽灏勶紝涓€х伆鎽勫奖妫氬湴锛?----------
    function setupGround(scene) {
      // 鍙嶅厜鍦版澘娓愬彉绾圭悊锛氫腑蹇冨井浜?#eceff4 鈫?杈圭紭涓€х伆 #c6cdd8锛堝井濡欐笎鍙橈紝鏃犳殫瑙掞級
      const gcv = document.createElement('canvas');
      gcv.width = 1024; gcv.height = 1024;
      const gctx = gcv.getContext('2d');
      const gg = gctx.createRadialGradient(512, 512, 150, 512, 512, 740);
      gg.addColorStop(0, '#a5aab2');
      gg.addColorStop(1, '#7c828c');
      gctx.fillStyle = gg;
      gctx.fillRect(0, 0, 1024, 1024);
      const gtex = new THREE.CanvasTexture(gcv);
      gtex.colorSpace = THREE.SRGBColorSpace;
      // 澶х悊鐭冲湴闈細宸ㄥぇ骞抽潰 200x200锛屾竻婕嗗弽鍏?+ 娓愬彉
      // roughness 0.3 鍗婂厜婊?/ clearcoat 1.0 鎶涘厜 / envMapIntensity 1.5 寮虹幆澧冨弽灏勶紙寰鍊掑奖鎰燂級
      const marble = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshPhysicalMaterial({
          color: 0xffffff, map: gtex, roughness: 0.3, metalness: 0.05,
          clearcoat: 1.0, clearcoatRoughness: 0.1,
          envMapIntensity: 1.5
        })
      );
      marble.rotation.x = -Math.PI / 2;
      marble.position.y = 0;
      marble.receiveShadow = true;   // 鎺ヨЕ闃村奖
      scene.add(marble);
      return { marble };
    }

    // ---------- 鈶?璁惧浣庢ā锛堢洿鎺ヨ惤鍦ㄥぇ鐞嗙煶鍦伴潰锛?----------
    const N = 8;                  // 璁惧鏁伴噺锛堝睍鍘呭浐瀹?8 鍙帮級
    const R = 5.0;                // 璁惧鐜粫鍗婂緞
    let bodyMesh, baseMesh, labels, defaultColors, devicePositions;
    const palette = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa29bfe, 0xff8a5c, 0x55efc4, 0xff6b8a, 0x74b9ff, 0xfd79a8, 0x00cec9];
    function setupDevices(scene) {
      devicePositions = [];
      // 鏈鸿韩/搴曞骇锛氬弽灏勭伅鍏夋洿鏈夎川鎰熺殑鏉愯川锛坢etalness 0.3 / roughness 0.4锛夛紝鏋佹贰闈掕壊鑷彂鍏?
      const deviceMat = new THREE.MeshStandardMaterial({
        roughness: 0.4, metalness: 0.3, color: 0xffffff,
        emissive: 0x00ffff, emissiveIntensity: 0.1
      });
      bodyMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.85, 0.85, 0.85), deviceMat, N);
      baseMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.5, 0.62, 0.14, 24), deviceMat, N);
      bodyMesh.castShadow = true;   // 鎶曞皠闃村奖 鈫?澶х悊鐭冲湴闈笂鐨勬帴瑙﹂槾褰?
      baseMesh.castShadow = true;
      defaultColors = [];
      const dummy = new THREE.Object3D();
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const p = new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R);
        devicePositions.push(p);
        // 鏈鸿韩锛堢洿鎺ヨ惤鍦帮級
        dummy.position.set(p.x, 0.55, p.z);
        dummy.rotation.set(0, -a + Math.PI / 2, 0);
        dummy.updateMatrix();
        bodyMesh.setMatrixAt(i, dummy.matrix);
        // 搴曞骇
        dummy.position.set(p.x, 0.07, p.z);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        baseMesh.setMatrixAt(i, dummy.matrix);
        // 瀹炰緥棰滆壊锛堝尯鍒嗚澶囷級
        const c = new THREE.Color(palette[i]);
        bodyMesh.setColorAt(i, c);
        baseMesh.setColorAt(i, c.clone().multiplyScalar(0.55));
        defaultColors.push(c);
      }
      bodyMesh.instanceColor.needsUpdate = true;
      baseMesh.instanceColor.needsUpdate = true;
      scene.add(bodyMesh, baseMesh);
      // 鍚嶇О鏍囩锛圫prite 鏂囧瓧绾圭悊锛屼笉鍙楅浘褰卞搷锛?
      labels = [];
      function makeLabel(text, i) {
        const cv = document.createElement('canvas');
        // canvas 瀹藉害鎸夋枃鏈疄闄呴暱搴﹁嚜閫傚簲锛堥暱鍚嶇О濡傘€?2RS涓棿鍙?鍘嬫満銆嶄笉琚鍓級
        const LABEL_FONT = 'bold 34px "Microsoft YaHei", sans-serif';
        const meas = document.createElement('canvas').getContext('2d');
        meas.font = LABEL_FONT;
        const textW = Math.ceil(meas.measureText(text).width) + 40;   // 宸﹀彸鐣欑櫧 20px
        cv.width = Math.max(120, textW); cv.height = 64;
        const ctx = cv.getContext('2d');
        ctx.font = LABEL_FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, cv.width, 64);
        ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 6;
        ctx.strokeText(text, cv.width / 2, 34);
        ctx.fillStyle = '#eaf2ff'; ctx.fillText(text, cv.width / 2, 34);
        const tex = new THREE.CanvasTexture(cv);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        // 涓栫晫姣斾緥闅忕敾甯冨搴﹁嚜閫傚簲锛堥伩鍏嶉暱鏂囨湰琚帇鎵侊級锛岄珮搴﹀熀鍑?0.55
        const aspect = cv.width / cv.height;
        sp.scale.set(0.55 * aspect, 0.55, 1);
        sp.position.set(devicePositions[i].x, 1.85, devicePositions[i].z);
        sp.userData.deviceId = i;
        sp.renderOrder = 10;
        labels.push(sp);
        scene.add(sp);
      }
      return makeLabel;
    }

    /* ================= 鍏ㄦ櫙鍦烘櫙鍒濆鍖栵紙妯″潡鍖栫粍鍚堬級 ================= */
    const sceneLow = new THREE.Scene();
    setupBackground(sceneLow);
    setupGround(sceneLow);
    setupLights(sceneLow, rendererLow);      // 涓€鐩忚仛鍏夌伅 + 闃村奖
    const makeLabel = setupDevices(sceneLow);

    /* ================= 楂樻ā鍦烘櫙锛堣鎯咃紝鍔ㄦ€佸姞杞?鍗歌浇锛?================= */
    const sceneHigh = new THREE.Scene();
    // 璇︽儏鐓ф槑锛氭憚褰辨鏌斿厜绠憋紙鍓?+ 椤舵鏍兼爡鐏紝寮哄害缁忓疄娴嬫牎鍑嗭級+ 寮辩幆澧冨厜
    sceneHigh.add(new THREE.AmbientLight(0xffffff, 0.45));

    sceneHigh.add(hTop);

    /* ================= HDRI 鐜锛堥噾灞炲弽灏勶紝瑙ｅ喅鍙戦粦锛涗笉褰卞搷鑳屾櫙鑹诧級 ================= */
    // 鐢?RGBELoader 鍔犺浇宸ヤ笟椋?HDRI 鈫?PMREM 鐜璐村浘 鈫?鍏ㄦ櫙/璇︽儏鍏变韩 scene.environment
    // scene.background 淇濇寔娣¤摑鐏版憚褰辨锛?cbd5e1锛夛紝HDRI 鍙綔鐜鍙嶅皠鏉ユ簮
    // 浼樺厛绾э細polyhaven 鈫?鏈湴 hdr/ 鈫?jsdelivr锛涘叏閮ㄥけ璐ュ垯璺宠繃锛堣仛鍏夌伅浠嶅彲鐓ф槑锛?
    const HDR_SOURCES = [
      'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/studio_small_09_2k.hdr',   // 鎽勫奖妫氶鏍硷細鏃犵紳360掳銆佷腑鎬х伆銆佹煍鍏夌銆佸潎鍖€鐓ф槑
      'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/industrial_sunset_puresky_1k.hdr',
      './hdr/studio.hdr',
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/equirectangular/royal_esplanade_1k.hdr'
    ];
    const rgbe = new RGBELoader();
    const pmremEnv = new THREE.PMREMGenerator(rendererLow);
    // 鈶?绔嬪嵆鐢?RoomEnvironment 璁剧疆鐜锛堝悓姝ワ紝绾噾灞炴ā鍨嬬灛闂存湁鍙嶅皠锛屼笉浼氶粦锛?
    // 鈶?寮傛鍔犺浇 HDRI锛屾垚鍔熷悗鏇挎崲锛堟洿鐪熷疄锛涘け璐ュ垯淇濇寔 RoomEnvironment锛?
    const envFallback = pmremEnv.fromScene(new RoomEnvironment(), 0.04).texture;
    sceneLow.environment = envFallback;
    sceneHigh.environment = envFallback;
    function loadEnv(index) {
      if (index >= HDR_SOURCES.length) { console.warn('[绾夸笂灞曞巺] HDRI 鍔犺浇澶辫触锛屼繚鎸?RoomEnvironment 鐜'); return; }
      rgbe.load(HDR_SOURCES[index], tex => {
        tex.mapping = THREE.EquirectangularReflectionMapping;
        window.__hdrBg = tex;   // 淇濈暀 equirect 绾圭悊锛圚DRI 鑳屾櫙鐢級
        const env = pmremEnv.fromEquirectangular(tex).texture;
        sceneLow.environment = env;    // 鈫?鍏抽敭锛氬叏鏅噾灞炲弽灏勫厜
        sceneHigh.environment = env;   // 鈫?鍏抽敭锛氳鎯呴噾灞炲弽灏勫厜
        // 鑳屾櫙鍚屾涓?HDRI锛堝彈銆孒DRI 鑳屾櫙銆嶅紑鍏虫帶鍒讹紝榛樿寮€锛涘叧闂洖娣¤摑鐏帮級
        if (params.hdrBackground !== false) sceneLow.background = tex;
        tex.needsUpdate = true;
        pmremEnv.dispose();
        console.log('[绾夸笂灞曞巺] HDRI 鐜宸插簲鐢?', HDR_SOURCES[index]);
      }, null, () => loadEnv(index + 1));
    }
    loadEnv(0);
    // 鐜寮哄害鍏ㄥ眬鎺у埗锛圚DR 璋冭妭锛?
    // 澶у巺锛坰ceneLow锛夎窡闅忔粦鏉★紙榛樿 0.1锛屽厜绾挎煍鍜屼笉鍒虹溂锛夛紱
    // 璇︽儏锛坰ceneHigh锛変笉浣庝簬 1.5锛堥噾灞炴ā鍨嬪繀椤绘湁瓒冲鍙嶅皠锛屽惁鍒欏彂榛戯級
    function setEnvIntensity(k) {
      const apply = (sc, v) => {
        sc.traverse(o => {
          if (o.isMesh && o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(m => { if (m && 'envMapIntensity' in m) m.envMapIntensity = v; });
          }
        });
      };
      apply(sceneLow, k);                 // 澶у巺锛氶粯璁?0.1
      apply(sceneHigh, Math.max(k, 2.0)); // 璇︽儏锛氳嚦灏?2.0锛堟槑浜竻鏅帮級
    }

    const loader = new GLTFLoader();
    // Draco 瑙ｇ爜锛坢odels/device-XX.glb 宸茬敤 gltf-transform Draco 鍘嬬缉锛屼綋绉缉灏?6~14 鍊嶏級
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('./lib/draco/');
    // 涓嶅己鍒?type 鈫?wasm 浼樺厛锛堟瘮 JS 蹇害 10 鍊嶏級锛屽姞杞藉け璐ヨ嚜鍔ㄥ洖閫€ JS 瑙ｇ爜鍣?
    loader.setDRACOLoader(dracoLoader);

    /* ================= 鍏ㄦ櫙缂╃暐妯″瀷锛堟湁妯″瀷鈫掓樉绀虹缉鐣ワ紝鏃犳ā鍨嬧啋淇濈暀绔嬫柟浣擄級 ================= */
    const thumbObjects = [];   // 鍏ㄦ櫙缂╃暐妯″瀷锛堝彲鐐瑰嚮锛?
    // 缂╃暐鍥惧凡鍏ㄩ儴缁?simplify+join 杞婚噺鍖栵紙mesh 鏁颁粠鏁板崈闄嶅埌 ~100銆佷綋绉?2-6MB锛夛紝
    // 鍏ㄦ櫙鍙洿鎺ユ樉绀猴紱姝ら粦鍚嶅崟鏆傜┖锛堝師鐢ㄤ簬璺宠繃瓒呭ぇ缂╃暐闃茬Щ鍔ㄧ宕╂簝锛?
    const HEAVY_MODELS = [];
    const isHeavyModel = (model) => HEAVY_MODELS.includes(model);
    // 鍔犺浇鍗曞彴缂╃暐妯″瀷锛堟湁妯″瀷鈫掓樉绀虹缉鐣ワ紱澶辫触/鏃犳枃浠垛啋淇濈暀绔嬫柟浣撳崰浣嶏級
    function loadOneThumb(d, i) {
      return new Promise(resolve => {
        // 瓒呭ぇ妯″瀷鍏ㄦ櫙涓嶅姞杞?3D 缂╃暐锛堜繚鐣欑珛鏂逛綋鍗犱綅锛岄槻鍐呭瓨宕╂簝锛?
        if (isHeavyModel(d.model)) { resolve(); return; }
        // 缂╃暐璺緞锛歮odels/device-XX.glb 鈫?models/thumb/device-XX.glb锛?
        // d1(model.glb) 鈫?models/thumb/device-01.glb锛堝叏鏅敤杞婚噺缂╃暐锛岄伩鍏嶅姞杞?11MB 鍘熸ā鍨嬶級
        const thumbUrl = d.model.startsWith('models/')
          ? d.model.replace('models/', 'models/thumb/')
          : 'models/thumb/device-01.glb';
        loader.load(ver(thumbUrl), gltf => {
          const obj = gltf.scene || gltf.scenes[0];
          markLogoNodes(obj);   // LOGO 鎵撴爣淇濈暀鏄剧ず锛屼笉鍙備笌缂╂斁/钀藉湴璁＄畻
          if (PERF.downgradeMaterial) downgradeMobileMaterial(obj);   // 绉诲姩绔叏鏅缉鐣ュ悓鏍?PBR鈫扨hong
          const box = boxExcl(obj);
          const size = box.getSize(new THREE.Vector3());
          if (size.x <= 0 || size.y <= 0 || size.z <= 0) { resolve(); return; }
          // 缂╂斁鍒板崰浣嶇珛鏂逛綋灏哄锛?.85锛夛紝鏈€闀胯竟涓哄熀鍑?
          const scale = 0.85 / Math.max(size.x, size.y, size.z);
          obj.scale.setScalar(scale);
          // 缂╂斁鍚庨噸绠楀寘鍥寸洅锛坵orld matrix 闇€鏇存柊鎵嶄細鍙嶆槧 scale锛?
          obj.updateMatrixWorld(true);
          box.copy(boxExcl(obj));
          const c = box.getCenter(new THREE.Vector3());
          const p = devicePositions[i];
          // 搴曢儴瀵归綈鍦伴潰锛坹=0锛夛細-box.min.y 浣挎ā鍨嬪畬鏁寸珛浜庡湴闈紝涓嶅煁鍏?涓嶆偓绌?
          obj.position.set(p.x - c.x, -box.min.y, p.z - c.z);
          obj.userData.deviceId = i;
          obj.traverse(o => { if (o.isMesh) o.userData.deviceId = i; });   // 瀛愮綉鏍煎彲鐐瑰嚮鍛戒腑
          thumbObjects.push(obj);
          sceneLow.add(obj);
          setEnvIntensity(params.envIntensity);   // 澶у巺缂╃暐妯″瀷涔熷簲鐢?0.1锛堜笉鍒虹溂锛?
          // 闅愯棌瀵瑰簲绔嬫柟浣撳疄渚嬶紙鐭╅樀缂╂斁涓?0锛?
          const hide = new THREE.Object3D();
          hide.position.set(p.x, 0, p.z);
          hide.scale.set(0.0001, 0.0001, 0.0001);
          hide.updateMatrix();
          bodyMesh.setMatrixAt(i, hide.matrix);
          baseMesh.setMatrixAt(i, hide.matrix);
          bodyMesh.instanceMatrix.needsUpdate = true;
          baseMesh.instanceMatrix.needsUpdate = true;
          console.log('[绾夸笂灞曞巺] 鍏ㄦ櫙缂╃暐宸插姞杞?', d.name, '(' + thumbUrl + ')');
          resolve();
        }, null, () => { resolve(); });   // 鏃犵缉鐣ユ枃浠?鈫?淇濈暀绔嬫柟浣撳崰浣?
      });
    }
    // 娓愯繘寮忓姞杞界缉鐣ワ細浠?fromIndex 璧蜂覆琛屽姞杞斤紙鍓嶅嚑鍙扮敱棣栧睆鍏堣鍔犺浇锛?
    function loadThumbsFrom(fromIndex, onProgress) {
      const total = state.devices.length;
      if (fromIndex >= total) return Promise.resolve();
      return (async () => {
        for (let i = fromIndex; i < total; i++) {
          await loadOneThumb(state.devices[i], i);
          if (onProgress) onProgress((i + 1 - fromIndex) / (total - fromIndex));
        }
        console.log('[绾夸笂灞曞巺] 鍏ㄩ儴鍏ㄦ櫙缂╃暐鍔犺浇瀹屾垚');
      })();
    }

    /* ================= 鍐呭瓨绠＄悊锛氶€掑綊閲婃斁妯″瀷璧勬簮 ================= */
    function disposeObject(obj) {
      obj.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (!m) return;
            for (const k in m) if (m[k] && m[k].isTexture) m[k].dispose();
            m.dispose();
          });
        }
      });
    }
    function unloadHighModel() {
      if (!state.highModel) return;
      sceneHigh.remove(state.highModel);
      disposeObject(state.highModel);
      state.highModel = null;
      console.log('[绾夸笂灞曞巺] 宸插嵏杞介珮绮惧害妯″瀷锛屽唴瀛樺凡閲婃斁');
    }

    // 鏍囪銆岃€愬浐LOGO銆嶇嫭绔嬭妭鐐癸細涓嶅垹闄わ紙LOGO 鎸夋ā鍨嬩綅缃甯告樉绀猴級锛屼粎鎵撴爣
    // 浣?boxExcl 鍦ㄨ绠楀寘鍥寸洅/鍙栨櫙鏃舵帓闄?LOGO锛岄伩鍏嶅叾鎷夊亸鏃嬭浆涓績涓庣缉鏀炬瘮渚?
    function markLogoNodes(obj) {
      if (!obj) return;
      obj.traverse(o => {
        if (o.isMesh) return;
        if (/鑰愬浐LOGO|LOGO\.\d|^LOGO$/i.test(o.name || '')) {
          let hasMesh = false;
          o.traverse(c => { if (c.isMesh) hasMesh = true; });
          if (hasMesh) { o.userData.isLogo = true; o.traverse(c => { c.userData.isLogo = true; }); }
        }
      });
    }

    // 璁＄畻鎺掗櫎 LOGO 瀛愭爲鐨勫寘鍥寸洅锛圠OGO 浠嶆覆鏌撴樉绀猴紝浣嗕笉鍙備笌缂╂斁/鍙栨櫙/钀藉湴璁＄畻锛?
    function boxExcl(obj) {
      const box = new THREE.Box3();
      obj.updateMatrixWorld(true);
      const stack = [obj];
      while (stack.length) {
        const n = stack.pop();
        if (n.userData && n.userData.isLogo) continue;   // 璺宠繃 LOGO 鏁存５瀛愭爲
        if (n.isMesh) box.expandByObject(n);
        for (const c of n.children || []) stack.push(c);
      }
      return box;
    }

    /* ================= 鐩告満椋炶锛堝钩婊戠紦鍔級 ================= */
    function easeInOutCubic(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function flyTo(pos, tgt, dur = 900) {
      return new Promise(res => {
        const p0 = camera.position.clone();
        const t0 = controls.target.clone();
        const start = performance.now();
        controls.enabled = false;   // 椋炶鏈熼棿閿佸畾浜や簰
        (function step(now) {
          const k = Math.min(1, (now - start) / dur);
          const e = easeInOutCubic(k);
          camera.position.lerpVectors(p0, pos, e);
          controls.target.lerpVectors(t0, tgt, e);
          controls.update();
          if (k < 1) requestAnimationFrame(step);
          else { controls.enabled = true; res(); }
        })(start);
      });
    }

    // 鍏ㄦ櫙瑙嗚 / 璇︽儏鐗瑰啓瑙嗚
    function overviewView() {
      // 鍒濆瑙嗚锛氱浉鏈哄湪 z+ 鍓嶆柟 (0,2.5,8)锛岃绾跨劍鐐规瀵瑰墠鎺掕澶囩粍涓績 (0,0.8,3.8)
      // 鈫?鎵撳紑鐢婚潰涓ぎ鍗崇鐩告満鏈€杩戠殑杩戝鍓嶆帓璁惧锛屽悗鎺掕澶囧湪鐢婚潰杈圭紭
      return { pos: new THREE.Vector3(0, 2.5, 8), tgt: new THREE.Vector3(0, 0.8, 3.8) };
    }
    function detailView(i) {
      const p = devicePositions[i];
      const dir = p.clone().normalize();
      const pos = p.clone().addScaledVector(dir, 2.4).add(new THREE.Vector3(0, 0.9, 0));
      const tgt = p.clone().add(new THREE.Vector3(0, 0.4, 0));
      return { pos, tgt };
    }

    /* ================= 楂樹寒閫変腑璁惧锛堜綆妯″疄渚嬪彉鑹诧級 ================= */
    const HIGHLIGHT = new THREE.Color(0xffd54a);
    function highlightInstance(i) {
      for (let k = 0; k < N; k++) {
        bodyMesh.setColorAt(k, k === i ? HIGHLIGHT : defaultColors[k]);
        baseMesh.setColorAt(k, k === i ? HIGHLIGHT.clone().multiplyScalar(.8) : defaultColors[k].clone().multiplyScalar(.55));
      }
      bodyMesh.instanceColor.needsUpdate = true;
      baseMesh.instanceColor.needsUpdate = true;
    }
    function clearHighlight() {
      for (let k = 0; k < N; k++) {
        bodyMesh.setColorAt(k, defaultColors[k]);
        baseMesh.setColorAt(k, defaultColors[k].clone().multiplyScalar(.55));
      }
      bodyMesh.instanceColor.needsUpdate = true;
      baseMesh.instanceColor.needsUpdate = true;
    }

    /* ================= 鍔犺浇閬僵 ================= */
    function setLoading(show, text, pct) {
      if (show) {
        overlay.classList.remove('hidden', 'error');
        loadingText.textContent = text || '鍔犺浇涓€?;
        const raw = pct === undefined ? 0 : Math.round(pct * 100);
        const p = Math.max(0, Math.min(100, raw));   // 閽冲埗 0-100%锛堣繘搴︿簨浠惰宸笉浼氳秴杩?100%锛?
        progressBar.style.width = p + '%';

        overlay.classList.add('hidden');

    /* ================= 璇︽儏闈㈡澘 ================= */
    const panel = document.getElementById('detail-panel');
    const panelName = panel.querySelector('.dp-name');
    const panelDesc = panel.querySelector('.dp-desc');
    const panelParams = panel.querySelector('.dp-params');
    const panelStatus = panel.querySelector('.dp-status');
    const dpMini = document.getElementById('dp-mini');
    // 闈㈡澘鎶樺彔锛氭敹璧峰悗鍙暀杩蜂綘鏍囩鏉★紝涓嶉伄鎸℃ā鍨?
    function collapsePanel() {
      panel.classList.add('collapsed');
      panel.classList.remove('show');
      dpMini.classList.remove('hidden');
    }
    function expandPanel() {
      panel.classList.remove('collapsed');
      panel.classList.add('show');
      dpMini.classList.add('hidden');
    }
    document.getElementById('dp-collapse').addEventListener('click', collapsePanel);
    dpMini.addEventListener('click', expandPanel);
    function setStatus(text, cls) {
      panelStatus.textContent = text;
      panelStatus.className = 'dp-status' + (cls ? ' ' + cls : '');
    }
    function openPanel(device) {
      panelName.textContent = device.name;
      panelDesc.textContent = device.desc || '';
      panelParams.innerHTML = '';
      const list = device.params && device.params.length ? device.params : [];
      if (!list.length) {
        panelParams.innerHTML = '<tr><td colspan="2" style="text-align:left;color:rgba(232,236,244,.4)">鏆傛棤鍙傛暟</td></tr>';
      } else {
        list.forEach(it => {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>' + esc(it.k) + '</td><td>' + esc(it.v) + '</td>';
          panelParams.appendChild(tr);
        });
      }
      setStatus('姝ｅ湪鍔犺浇妯″瀷鈥?, 'loading');
      expandPanel();   // 杩涘叆鏂拌澶囨椂纭繚闈㈡澘灞曞紑
    }
    function closePanel() {
      panel.classList.remove('show', 'collapsed');
      dpMini.classList.add('hidden');
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ================= 鍔ㄦ€佸姞杞介珮绮惧害妯″瀷锛堝甫杩涘害 + 绔炴€佷护鐗岋級 ================= */
    // 绾圭悊鍚勫悜寮傛€э細鎷夎繎/鏂滆瑙掓椂璐村浘涓嶇硦鐨勫叧閿紙涓婇檺 8锛屽吋椤剧Щ鍔ㄧ鎬ц兘锛?
    function boostTextures(obj) {
      const maxAniso = rendererHigh.capabilities.getMaxAnisotropy();
      obj.traverse(o => {
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (!m) return;
            for (const k in m) {
              if (m[k] && m[k].isTexture) {
                m[k].anisotropy = Math.min(8, maxAniso);
                m[k].needsUpdate = true;
              }
            }
          });
        }
      });
    }
    // 閲戝睘鏉愯川鍙鎬у寮猴細metalness=1 + roughness=1 鐨?绮楃硻绾噾灞?鍦ㄧ幆澧冧笉瓒虫椂鍛堥粦鍓奖
    // 鈫?鎻愰珮 envMapIntensity + 鐣ラ檷 metalness锛堜繚鐣欓噾灞炴劅锛屼絾璁╂极鍙嶅皠鍙備笌锛岄槻鍏ㄩ粦锛?
    function ensureMetalVisible(obj) {
      obj.traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (!m || m.isMeshBasicMaterial || m.metalness === undefined) return;
            m.envMapIntensity = Math.max(m.envMapIntensity || 1, 2.0);
            if (m.metalness > 0.7) m.metalness = 0.75;
            m.needsUpdate = true;
          });
        }
      });
    }
    // 绉诲姩绔潗璐ㄩ檷绾э細PBR(Standard/Physical) 鈫?Phong锛岀Щ闄ょ幆澧冭创鍥惧弽灏勶紝
    // 鏄捐憲闄嶄綆鐫€鑹插櫒/绾圭悊寮€閿€锛堜繚鐣欓鑹蹭笌璐村浘锛涢噾灞炴劅鐢遍珮鍏夎繎浼硷級
    function downgradeMobileMaterial(obj) {
      obj.traverse(o => {
        if (!o.isMesh || !o.material) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        o.material = mats.map(m => {
          if (!m || m.isMeshPhongMaterial || m.isMeshLambertMaterial || m.isMeshBasicMaterial) return m;
          const phong = new THREE.MeshPhongMaterial({
            color: (m.color || new THREE.Color(0xcccccc)).clone(),
            emissive: m.emissive ? m.emissive.clone() : new THREE.Color(0),
            emissiveIntensity: m.emissiveIntensity !== undefined ? m.emissiveIntensity : 0,
            shininess: 40,               // 杩戜技閲戝睘楂樺厜
            specular: new THREE.Color(0x666666),
            transparent: m.transparent === true,
            opacity: m.opacity !== undefined ? m.opacity : 1,
            side: m.side !== undefined ? m.side : THREE.FrontSide,
            depthWrite: m.depthWrite !== undefined ? m.depthWrite : true
          });
          // 璐村浘淇濈暀锛坢ap/normalMap 绛夛紱none 鍒欑函鑹诧級
          if (m.map) { phong.map = m.map; }
          if (m.normalMap) { phong.normalMap = m.normalMap; }
          if (m.alphaMap) { phong.alphaMap = m.alphaMap; }
          phong.envMap = null;           // 绉婚櫎鐜鍙嶅皠锛堟€ц兘鍏抽敭锛?
          phong.needsUpdate = true;
          if (m !== phong) m.dispose();
          return phong;
        });
        o.material = Array.isArray(o.material) && o.material.length === 1 ? o.material[0] : o.material;
      });
    }
    // 妯″瀷灏变綅缁熶竴鏉愯川澶勭悊锛歅C 澧炲己閲戝睘鍙鎬э紱绉诲姩绔檷绾?PBR鈫扨hong锛堟€ц兘鍒嗙骇锛?
    function adaptMaterial(obj) {
      if (PERF.downgradeMaterial) downgradeMobileMaterial(obj);
      else ensureMetalVisible(obj);
    }
    function loadHighModel(device) {

      return new Promise(resolve => {

        //  PC锛圥ERF.upgradeHigh=true锛夛細鐩存帴鍔犺浇楂樻ā锛堣烦杩囦綆璐ㄧ缉鐣?鈫?鍦嗘煴鍦嗐€侀浂浠跺畬鏁淬€佺粏鑺傚叏淇濈暀锛?
        //  绉诲姩绔紙upgradeHigh=false锛夛細鍙敤杞婚噺缂╃暐锛堢ǔ瀹氫笉宕╋級
        // 绉诲姩绔缉鐣ヨ矾寰勶細models/device-XX.glb 鈫?models/thumb/device-XX.glb锛沝1(model.glb) 鈫?device-01.glb
        const thumbUrl = PERF.upgradeHigh ? null
          : device.model.startsWith('models/')

        let firstLoaded = null;   // 绗竴娈垫樉绀虹殑妯″瀷锛堢缉鐣?LOD0锛屼粎绉诲姩绔娇鐢級

        // 妯″瀷灏变綅锛堝鐞嗘潗璐?+ 鍏ュ満鏅級锛涗换浣曡矾寰勯兘蹇呴』 resolve锛岄伩鍏?Loading 鍗℃
        const finish = (obj) => {

          boostTextures(obj);

          setEnvIntensity(params.envIntensity);

        // 绗簩娈碉細鍚庡彴鍔犺浇楂樻ā锛圠OD1锛夛紝灏辩华鍚庢棤缂濇浛鎹㈢缉鐣ュ苟閲婃斁缂╃暐鍐呭瓨
        // 娉ㄦ剰锛氬畬鍏ㄥ悗鍙板寲 鈥斺€?涓嶆樉绀哄叏灞忛伄缃╋紙閬垮厤鎸′綇宸叉樉绀虹殑缂╃暐妯″瀷锛夛紝鏇挎崲鏃犳劅
        // 鐢?enterToken 鍒ゆ柇銆屾槸鍚﹀凡琚繑鍥?鍒囨崲鎵撴柇銆嶏細杩涘叆娴佺▼涓?mode 鏄?TRANSITION锛?
        // 涓嶈兘鎷?mode 鍒ゆ柇锛堢洿鎺ュ姞杞介珮妯℃椂 enterDetail 浠嶅湪 await锛宮ode 灏氭湭鍙樹负 DETAIL锛?
        const loadHigh = (allowRetry) => {
          loader.load(ver(device.model), gltf => {

            if (state.enterToken !== enterTokenAtCall) {   // 宸茶繑鍥炲叏鏅垨鍒囨崲鍒板叾瀹冭澶?鈫?涓㈠純

            const prevPos = firstLoaded ? firstLoaded.position.clone() : null;

            // 楂樻ā鏇挎崲缂╃暐鍚庣殑鍙栨櫙澶勭悊锛氭柊 obj 鐨?position 鏄粯璁ゅ€硷紝鏈户鎵跨缉鐣ョ殑灞呬腑骞崇Щ锛?
            // 鍚﹀垯妯″瀷浼氬亸绂绘棆杞腑蹇冦€?60掳 瑙傚療涓嶉『
            if (state.mode === Mode.DETAIL) {

              setTimeout(() => loadHigh(false), 800);

            }

        if (thumbUrl) {

    /* ================= 妯″紡鍒囨崲锛堟牳蹇冪姸鎬佹満閫昏緫锛?================= */

    // 鐗瑰啓鍙栨櫙锛氣憼妯″瀷灞呬腑锛堟棆杞腑蹇?妯″瀷涓績锛岃Е鎺ф祦鐣呯殑鍏抽敭锛?
    //          鈶＄浉鏈?鐩爣鐐瑰悓姝ュ钩绉?+ 璺濈閫傞厤
    // 鐢?boxExcl锛歀OGO 鎵撴爣鍚庝粛鏄剧ず锛屼絾涓嶅弬涓庡彇鏅紙閬垮厤鍏惰繙绂讳富浣撴椂鎷夊亸鏃嬭浆涓績锛?
    function fitDetailView(obj) {
      const box = boxExcl(obj);
      if (box.isEmpty()) return;
      const center = box.getCenter(new THREE.Vector3());
      // 1) 妯″瀷灞呬腑锛氭妸鍖呭洿鐩掍腑蹇冨钩绉诲埌 (0, 0.3, 0)锛岃鏃嬭浆杞村鍑嗘ā鍨嬩腑蹇?
      obj.position.add(new THREE.Vector3(-center.x, 0.3 - center.y, -center.z));
      box.copy(boxExcl(obj));
      const r = box.getBoundingSphere(new THREE.Sphere()).radius;
      const want = Math.max(r / Math.tan((camera.fov * Math.PI) / 360) * 1.15, r * 2);
      // 2) 鐩爣鐐瑰綊浣嶅埌妯″瀷涓績锛岀浉鏈哄悓姝ュ钩绉讳繚鎸佺浉瀵逛綅缃?
      const oldT = controls.target.clone();
      controls.target.set(0, 0.3, 0);
      camera.position.add(controls.target.clone().sub(oldT));
      // 3) 璺濈閫傞厤
      const dir = camera.position.clone().sub(controls.target);
      const cur = dir.length();
      if (Math.abs(want - cur) > 0.05) {
        dir.normalize().multiplyScalar(want);
        camera.position.copy(controls.target).add(dir);
      }
      camera.near = Math.max(0.01, r * 0.001);
      camera.far = Math.max(100, want * 10);
      camera.updateProjectionMatrix();
      controls.minDistance = r * 0.1;
      controls.maxDistance = r * 20;
      controls.update();
    }

    /* ================= 鐐瑰嚮鎷惧彇锛圧aycaster 鈫?instanceId锛?================= */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downPos = null;
    rendererHigh.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
    // 鍙屽嚮瀹氱偣鏀惧ぇ锛氬懡涓ā鍨嬪 鈫?鐩爣鐐圭Щ鍒拌澶勫苟鎷夎繎锛涘弻鍑荤┖鐧?鈫?鍥炲埌妯″瀷鏁翠綋
    rendererHigh.domElement.addEventListener('dblclick', e => {
      if (state.mode !== Mode.DETAIL || !state.highModel) return;
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(state.highModel, true);
      if (hits.length) {
        controls.target.copy(hits[0].point);   // 瀹氱偣锛氭棆杞?鏀惧ぇ涓績绉诲埌鍛戒腑澶?
        controls.dollyIn(1.35);                // 鎷夎繎涓€绾?
      } else {
        // 鍙屽嚮绌虹櫧锛氬洖鍒版ā鍨嬫暣浣撹瑙掞紙fitDetailView 閲嶅畾浣嶏紝鎺掗櫎 LOGO锛?
        const c = boxExcl(state.highModel).getCenter(new THREE.Vector3());
        controls.target.set(c.x, c.y, c.z);
      }
    });
    rendererHigh.domElement.addEventListener('pointerup', e => {
      if (!downPos) return;
      const dx = e.clientX - downPos[0], dy = e.clientY - downPos[1];
      downPos = null;
      if (dx * dx + dy * dy > 36) return;   // 鎷栨嫿鏃嬭浆涓嶇畻鐐瑰嚮
      if (state.mode === Mode.TRANSITION) return;
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects([bodyMesh, baseMesh, ...labels, ...thumbObjects], false);
      if (!hits.length) return;
      const h = hits[0];
      const id = h.object.isInstancedMesh ? h.instanceId : h.object.userData.deviceId;
      if (id == null) return;
      if (state.mode === Mode.DETAIL && state.selectedIndex === id) return;
      enterDetail(id);
    });

    /* ================= 璁惧鍒楄〃锛堜晶鏍忥紝涓?3D 鎷惧彇鍙屽叆鍙ｏ級 ================= */
    function syncSidebar(i) {
      document.querySelectorAll('.device-tile').forEach((t, k) => {
        t.classList.toggle('active', k === i);
      });
    }
    function renderSidebar() {
      const list = document.getElementById('device-list');
      list.innerHTML = '';
      state.devices.forEach((d, i) => {
        const tile = document.createElement('div');
        tile.className = 'device-tile';
        tile.innerHTML = '<div class="dname">' + esc(d.name) + '</div><div class="dnum">#' + (i + 1) + '</div>';
        tile.addEventListener('click', () => enterDetail(i));
        list.appendChild(tile);
      });
    }

    /* ================= 鍒濆鍖栵細璇?models.json 鈫?鏋勫缓鍏ㄦ櫙 ================= */
    async function init() {
      try {
        setLoading(true, '鍒濆鍖栦腑鈥?, 0.08);
        const r = await fetch('./models.json', { cache: 'no-store' });
        const data = await r.json();
        state.devices = data.devices || [];
        if (!state.devices.length) { showFatal('models.json 涓病鏈夎澶?); return; }
        setLoading(true, '鏋勫缓灞曞巺鈥?, 0.18);
        renderSidebar();
        state.devices.forEach((d, i) => makeLabel(d.name, i));
        // 棣栧睆锛氬厛鍔犺浇鍓?2 鍙拌交閲忕缉鐣ワ紙蹇€熷嚭鐢婚潰锛夛紝閬僵鏄剧ず鐪熷疄杩涘害
        setLoading(true, '鍔犺浇灞曞巺妯″瀷鈥?, 0.2);
        await loadOneThumb(state.devices[0], 0);
        setLoading(true, '鍔犺浇灞曞巺妯″瀷鈥?, 0.55);
        if (state.devices[1]) await loadOneThumb(state.devices[1], 1);
        setLoading(false);
        // 鍏朵綑 6 鍙扮缉鐣ュ悗鍙伴€愬彴娓愯繘鍔犺浇锛堜笉闃诲杩涘叆锛岄檷浣庨灞忓唴瀛樺嘲鍊奸槻宕╂簝锛?
        setTimeout(() => {
          loadThumbsFrom(2, p => console.log('[绾夸笂灞曞巺] 缂╃暐鍔犺浇', Math.round(p * 100) + '%'));
        }, 300);
        console.log('[绾夸笂灞曞巺] 鍏ㄦ櫙灏辩华锛屽墿浣欑缉鐣ュ悗鍙板姞杞?);
      } catch (e) {
        console.error(e);
        showFatal('models.json 鍔犺浇澶辫触锛? + e.message);
      }
    }

    /* ================= lil-gui 鎺у埗闈㈡澘 ================= */
    const params = {
      autoRotate: true, autoRotateSpeed: 0.6,
      bloom: false, bloomStrength: 0.1, fogFar: 120, showFPS: false,
      exposure: 1.8, envIntensity: 0.7, hdrBackground: false,
      resetView: () => {
        if (state.mode === Mode.DETAIL && state.selectedIndex >= 0) {
          const v = detailView(state.selectedIndex);
          flyTo(v.pos, v.tgt, 700);
        } else {
          const v = overviewView();
          flyTo(v.pos, v.tgt, 700);
        }
      }
    };
    const gui = new GUI({ title: '鎺у埗闈㈡澘' });
    gui.open();   // 鎺у埗闈㈡澘濮嬬粓灞曞紑鏄剧ず鍐呭锛堥粯璁ゅ彸涓婅锛?
    const vf = gui.addFolder('瑙嗗浘');
    vf.add(params, 'resetView').name('閲嶇疆瑙嗚');
    vf.add(params, 'autoRotate').name('鑷姩鏃嬭浆').onChange(v => { controls.autoRotate = v; });
    vf.add(params, 'autoRotateSpeed', 0, 10, 0.1).name('鏃嬭浆閫熷害').onChange(v => { controls.autoRotateSpeed = v; });
    const rf = gui.addFolder('娓叉煋');
    // 浠呬繚鐣欐洕鍏夛紙鍏朵綑娓叉煋鍙傛暟鐢ㄤ唬鐮侀粯璁ゅ€硷紝涓嶆毚闇茬粰鐢ㄦ埛锛?
    rf.add(params, 'exposure', 0.5, 5, 0.05).name('鏇濆厜').onChange(v => { rendererLow.toneMappingExposure = 0.85; rendererHigh.toneMappingExposure = v; });
    vf.open(); rf.open();

    /* ================= 鏄惧紡搴旂敤榛樿鍙傛暟锛堥槻缂撳瓨/鏃跺簭闂锛屾墦寮€鍗崇敓鏁堬級 ================= */
    // 榛樿鏈€澶ч浘鍖栬窛绂伙紙far=120锛屾粦鏉′笂闄愶級+ 鏈€灏忔洕鍏夛紙0.5锛屾粦鏉′笅闄愶級
    sceneLow.fog.near = 30;
    sceneLow.fog.far = params.fogFar;
    rendererLow.toneMappingExposure = 0.85;   // 灞曞巺锛氭槑浜?
    rendererHigh.toneMappingExposure = params.exposure;   // 璇︽儏锛氫繚鎸佺幇鍦ㄨ缃?
    setEnvIntensity(params.envIntensity);   // 榛樿鐜寮哄害锛氬ぇ鍘?0.1锛堟煍鍜岋級锛岃鎯?鈮?.5锛堥槻榛戯級
    console.log('[绾夸笂灞曞巺] 榛樿鍙傛暟宸插簲鐢? 闆惧寲璺濈=' + sceneLow.fog.far + ' 鏇濆厜=' + params.exposure + ' (NAIGU EXPO V1.5)');

    /* ================= 鍚庡鐞嗭細杈夊厜閫氶亾锛堜粎鍏ㄦ櫙搴曞眰锛屾瀬鍏嬪埗闃茶繃鏇濓級 ================= */
    // UnrealBloomPass锛歴trength 0.15锛堟瀬寮卞厜鏅曪級/ radius 0.4 / threshold 1.0锛堜粎瓒呬寒澶勫彂鍏夛級
    // 閬垮厤鍙戝厜閮ㄥ垎杩囨洕瀵艰嚧妯″瀷鏈綋鐪嬩笉娓咃紱鍒嗚鲸鐜囧彇灞忓箷涓€鍗婂吋椤剧Щ鍔ㄧ
    const composer = new EffectComposer(rendererLow);
    composer.addPass(new RenderPass(sceneLow, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(Math.floor(innerWidth / 2), Math.floor(innerHeight / 2)),
      0.1, 0.4, 0.8   // 灞曞巺杈夊厜 0.1锛堝厠鍒讹紝鎺у埗闈㈡澘鍙皟锛?
    );
    composer.addPass(bloomPass);
    bloomPass.enabled = false;   // 鍙栨秷杈夊厜锛坓ui 鍙墜鍔ㄥ紑鍚級

    /* ================= FPS 缁熻锛堟€ц兘娴嬭瘯鐢級 ================= */
    let fpsEl = null, fpsFrames = 0, fpsLast = performance.now();
    function updateFPS(now) {
      fpsFrames++;
      if (now - fpsLast >= 500) {
        const fps = Math.round(fpsFrames * 1000 / (now - fpsLast));
        fpsFrames = 0; fpsLast = now;
        if (fpsEl) fpsEl.textContent = 'FPS: ' + fps;
      }
    }

    /* ================= 娓叉煋寰幆 / 鑷€傚簲 / 蹇嵎閿?================= */
    rendererLow.setAnimationLoop(() => {
      controls.update();
      composer.render();                                  // 鍏ㄦ櫙锛堝惈杈夊厜鍚庡鐞嗭級
      rendererHigh.render(sceneHigh, camera);             // 璇︽儏楂樻ā锛堟棤鍚庡鐞嗭紝淇濇寔娓呮櫚锛?
      updateFPS(performance.now());
    });
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      rendererLow.setSize(innerWidth, innerHeight);
      rendererHigh.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloomPass.resolution.set(Math.floor(innerWidth / 2), Math.floor(innerHeight / 2));
    });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && state.mode === Mode.DETAIL) exitDetail();
    });
    document.getElementById('back-btn').addEventListener('click', exitDetail);
    document.getElementById('lobby-btn').addEventListener('click', exitDetail);

    /* ================= 鍒嗕韩锛氬叕缃戦摼鎺?+ 浜岀淮鐮侊紙寰俊鎵爜鎵撳紑锛?================= */
    // 鍏綉姝ｅ紡鍦板潃锛圕loudBase 闈欐€佹墭绠★紝鑷姩閮ㄧ讲锛屽井淇?鎵嬫満鍙墦寮€锛?
    // 鏈湴璁块棶锛坙ocalhost锛夋椂鑷姩鏇挎崲涓鸿鍦板潃锛岄伩鍏嶆妸 localhost 鍙戠粰鍒汉鎵撲笉寮€
    const PUBLIC_URL = 'https://baigukeji-d6g7omgxc78b09a62-1469467156.tcloudbaseapp.com/';
    function isLocalUrl(url) {
      return /localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|192\.168\.|^https?:\/\/10\.|^https?:\/\/172\.(1[6-9]|2\d|3[01])\./i.test(url);
    }
    function getShareUrl() {
      const cur = location.href;
      return isLocalUrl(cur) ? PUBLIC_URL : cur;
    }
    // 浜岀淮鐮佸簱鍔犺浇锛堟湰鍦颁紭鍏堬紝CDN 鍥為€€锛?
    function loadQR(cb) {
      if (window.QRCode) return cb(window.QRCode);
      const urls = [
        './lib/qrcode.min.js',
        'https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.js',
        'https://registry.npmmirror.com/qrcode/latest/files/build/qrcode.js',
        'https://unpkg.com/qrcode/build/qrcode.js'
      ];
      let i = 0;
      (function next() {
        if (i >= urls.length) return cb(null);
        const s = document.createElement('script');
        s.src = urls[i++];
        s.onload = () => (window.QRCode ? cb(window.QRCode) : next());
        s.onerror = next;
        document.head.appendChild(s);
      })();
    }
    function refreshSharePanel() {
      const url = getShareUrl();
      const input = document.getElementById('share-url');
      const note = document.getElementById('share-note');
      input.value = url;
      note.textContent = isLocalUrl(location.href)
        ? '褰撳墠鏄湰鍦板湴鍧€锛屽凡鑷姩鏇挎崲涓哄叕缃戦摼鎺ワ紙寰俊鍙墦寮€锛?
        : '寰俊/鎵嬫満鎵爜鍗冲彲鎵撳紑鏈〉闈?;
      loadQR(QR => {
        const qr = document.getElementById('share-qr');
        if (QR) {
          try { QR.toCanvas(qr, url, { width: 180, margin: 1, errorCorrectionLevel: 'M' }); }
          catch (e) { note.textContent = '浜岀淮鐮佺敓鎴愬け璐ワ紝璇风洿鎺ュ鍒堕摼鎺ュ彂閫併€?; }
        } else {
          note.textContent = '浜岀淮鐮佺粍浠跺姞杞藉け璐ワ紙鍙兘绂荤嚎锛夛紝璇风洿鎺ュ鍒堕摼鎺ュ彂閫併€?;
        }
      });
    }
    const sharePanel = document.getElementById('share-panel');
    document.getElementById('share-btn').addEventListener('click', () => {
      const show = sharePanel.classList.toggle('show');
      if (show) refreshSharePanel();
    });
    document.getElementById('share-copy').addEventListener('click', () => {
      const input = document.getElementById('share-url');
      const url = input.value;
      if (!url) return;
      const done = () => { const b = document.getElementById('share-copy'); b.textContent = '鉁?宸插鍒?; setTimeout(() => b.textContent = '澶嶅埗', 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done);
      else { input.select(); document.execCommand('copy'); done(); }
    });

    // 鍚姩锛氬叏鏅瑙掑氨浣嶅悗娓叉煋璁惧鍏ㄦ櫙
    const v0 = overviewView();
    camera.position.copy(v0.pos);
    controls.target.copy(v0.tgt);
    controls.minDistance = 4;
    controls.maxDistance = 80;   // 灞曞彴鍗婂緞 15锛屽厑璁告媺杩滀刊鐬板叏鏅?
    controls.autoRotate = true;  // 鑷姩鏃嬭浆榛樿寮€鍚紙gui 鍙叧锛?
    controls.autoRotateSpeed = 0.6;  // 鎱㈤€熸棆杞紙绾?3.6掳/绉掞級锛屽厛鐪嬫竻鍓嶆帓鍐嶇紦缂撳睍绀?
    controls.update();
    init();
  </script>
