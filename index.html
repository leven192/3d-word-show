<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js GLB Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; }
    body {
      /* 浅色科技蓝径向渐变：默认中心色 #b1cdec (R177 G205 B236) → 四周略深蓝 */
      background: radial-gradient(circle at center, #b1cdec 0%, #9dc0e4 55%, #7fa9d9 100%);
      background-attachment: fixed;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* 加载提示 / 错误提示 */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: #e8eaf0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      pointer-events: none; z-index: 10; text-align: center; padding: 20px;
    }
    #overlay .spinner {
      width: 46px; height: 46px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: #4da3ff;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #overlay .msg { font-size: 16px; opacity: .92; line-height: 1.7; max-width: 720px; }
    #overlay .msg.error { color: #ff7b72; }
    #overlay .msg .small { font-size: 13px; opacity: .75; color: #b8bdc9; }
    #overlay .msg code {
      background: rgba(255,255,255,.09); border-radius: 4px; padding: 1px 6px;
      font-size: 13px;
    }

    /* 模型名称标签（左上角） */
    #model-label {
      position: fixed; top: 14px; left: 14px; z-index: 20;
      background: rgba(20, 23, 30, .72); border: 1px solid rgba(255,255,255,.09);
      border-radius: 8px; padding: 6px 12px;
      color: #d5d9e2; font: 13px "Segoe UI", "Microsoft YaHei", sans-serif;
      max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      display: none;
    }
    #model-label b { color: #4da3ff; font-weight: 600; }

    /* 拖拽高亮 */
    #app.dragging::after {
      content: "松开以加载 GLB 文件";
      position: fixed; inset: 12px; z-index: 30;
      border: 2px dashed #4da3ff; border-radius: 14px;
      background: rgba(13, 18, 30, .72);
      display: flex; align-items: center; justify-content: center;
      color: #cfe2ff; font: 17px "Segoe UI", "Microsoft YaHei", sans-serif; pointer-events: none;
    }

    #hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      color: rgba(232,234,240,.5); font: 12px "Segoe UI", "Microsoft YaHei", sans-serif;
      z-index: 20; pointer-events: none; white-space: nowrap;
    }

    /* 分享按钮与面板 */
    #share-btn {
      position: fixed; right: 14px; bottom: 14px; z-index: 20;
      background: #2b303b; color: #e8eaf0; border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px; padding: 8px 16px; cursor: pointer;
      font: 13px "Segoe UI", "Microsoft YaHei", sans-serif;
      box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: background .15s;
    }
    #share-btn:hover { background: #3a4150; }
    #share-panel {
      position: fixed; right: 14px; bottom: 60px; z-index: 20;
      width: 250px; background: rgba(20,23,30,.94); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
      padding: 12px; display: none; color: #d5d9e2;
      font: 12px "Segoe UI", "Microsoft YaHei", sans-serif;
      box-shadow: 0 4px 18px rgba(0,0,0,.45);
    }
    #share-panel h4 { margin: 0 0 8px; font-size: 13px; color: #e8eaf0; }
    #share-url-row { display: flex; gap: 6px; margin-bottom: 10px; }
    #share-url {
      flex: 1; min-width: 0; background: #262b36; color: #cfe2ff;
      border: 1px solid rgba(255,255,255,.12); border-radius: 6px;
      padding: 6px 8px; font-size: 11px; outline: none;
    }
    #share-copy { background: #3d6cff; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
    #share-copy:hover { background: #2f58d6; }
    #share-qr-wrap { display: flex; justify-content: center; }
    #share-qr { background: #fff; border-radius: 6px; padding: 6px; width: 180px; height: 180px; }
    #share-note { margin-top: 8px; color: rgba(232,234,240,.55); font-size: 11px; line-height: 1.6; }
    /* 本地环境黄色警告 */
    #share-warn {
      display: none; margin-bottom: 8px; padding: 6px 8px;
      background: rgba(255, 200, 60, .15); color: #ffc93c;
      border: 1px solid rgba(255, 200, 60, .4); border-radius: 6px;
      font-size: 11px; line-height: 1.5;
    }
    /* 手动输入框 */
    #share-manual-row { display: flex; gap: 6px; margin-top: 10px; }
    #share-manual {
      flex: 1; min-width: 0; background: #262b36; color: #cfe2ff;
      border: 1px solid rgba(255,255,255,.12); border-radius: 6px;
      padding: 6px 8px; font-size: 11px; outline: none;
    }
    #share-manual::placeholder { color: rgba(207,226,255,.4); }
    #share-manual-btn {
      background: #3d6cff; color: #fff; border: none; border-radius: 6px;
      padding: 6px 10px; cursor: pointer; font-size: 11px; white-space: nowrap;
    }
    #share-manual-btn:hover { background: #2f58d6; }
  </style>
</head>
<body>
  <div id="app">
    <div id="overlay">
      <div class="spinner"></div>
      <div class="msg">正在加载 model.glb ...</div>
    </div>
  </div>

  <div id="model-label">模型：<b id="model-name">model.glb</b></div>
  <div id="hint">单指/左键旋转 · 双指/右键平移 · 双指/滚轮缩放 · 右上角 lil-gui 控制面板</div>

  <button id="share-btn">分享 / 二维码</button>
  <div id="share-panel">
    <h4>把链接发给微信好友</h4>
    <div id="share-warn">⚠️ 检测到本地环境，请启动 cpolar 以获取公网二维码</div>
    <div id="share-url-row">
      <input id="share-url" readonly />
      <button id="share-copy">复制</button>
    </div>
    <div id="share-qr-wrap"><canvas id="share-qr"></canvas></div>
    <div id="share-manual-row">
      <input id="share-manual" placeholder="手动粘贴公网链接（如 https://xxx.cpolar.top）" />
      <button id="share-manual-btn">生成二维码</button>
    </div>
    <div id="share-note">手机微信/浏览器扫码即可查看 · 若微信拦截链接，点右上角「在浏览器中打开」</div>
  </div>

  <!-- 极老内核检测（如极速浏览器「兼容模式」= IE 内核，不支持 ES Module） -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.type = 'module';
      s.textContent = 'window.__ESM_OK__ = true;';
      document.head.appendChild(s);
      setTimeout(function () {
        if (!window.__ESM_OK__) {
          var ov = document.getElementById('overlay');
          if (ov && ov.style.display !== 'none') {
            ov.innerHTML = '<div class="msg error">当前浏览器过于老旧，无法运行 3D 页面（不支持 ES Module）。<br>' +
              '<span class="small">请使用 Chrome / Safari / Edge，或在极速浏览器地址栏切换到「极速模式」。</span></div>';
          }
        }
      }, 1500);
    })();
  </script>

  <!-- 默认 CDN（jsdelivr，全球 + 国内节点）；若加载失败会自动切换备用 CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- 二维码库加载（本地优先，多 CDN 回退；供分享面板使用） -->
  <script>
    window.__QR_CDNS = [
      './lib/qrcode.min.js',
      'https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.js',
      'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.js',
      'https://registry.npmmirror.com/qrcode/latest/files/build/qrcode.js',
      'https://unpkg.com/qrcode/build/qrcode.js',
      'https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js',
      'https://registry.npmmirror.com/qrcode/latest/files/build/qrcode.min.js',
      'https://unpkg.com/qrcode/build/qrcode.min.js'
    ];
    window.__loadQR = function (cb) {
      var i = 0;
      (function next() {
        if (i >= window.__QR_CDNS.length) { cb && cb(null); return; }
        var s = document.createElement('script');
        s.src = window.__QR_CDNS[i++];
        s.onload = function () { cb && cb(window.QRCode || null); };
        s.onerror = next;
        document.head.appendChild(s);
      })();
    };
  </script>

  <!-- ============================================================
       分享链接配置
       - 优先读取 share-config.js / current-url.txt：由「启动.bat」每次运行
         自动写入最新 cpolar 公网地址（隧道重启地址变了也会自动更新）；
       - 没有可用公网地址时，页面显示"生成中"，绝不使用过期/死地址。
       ============================================================ -->
  <script src="share-config.js"></script>
  <script src="model-embedded.js"></script>
  <script>
    window.__SHARE_PUBLIC_URL = window.__SHARE_PUBLIC_URL || '';
  </script>

  <script type="module">
    // ---------- 兼容性：加载 three.js + lil-gui ----------
    // 两条加载路径：
    // 路径① importmap：浏览器支持 importmap（Chrome 89+ / iOS 16.4+ 等）
    //    → 多 CDN 回退（jsdelivr → npmmirror → unpkg），国内网络友好；
    // 路径② 直连 URL：老内核不支持 importmap（老版极速浏览器、旧微信 X5 内核等）
    //    → 使用会自动改写裸导入的 CDN（jsdelivr +esm / esm.sh / jspm），
    //      任何支持 ES Module 的浏览器都能加载，完全不需要 importmap。
    // 注意：探测 importmap 不能用 HTMLScriptElement.supports()（Safari 17.2 才有，
    // iOS 16.7 支持 importmap 却没有它），改用运行时真探测。

    async function importMapSupported() {
      try {
        const blob = new Blob(['export default 1;'], { type: 'text/javascript' });
        const url = URL.createObjectURL(blob);
        const key = '__probe__' + Math.random().toString(36).slice(2);
        const s = document.createElement('script');
        s.type = 'importmap';
        s.textContent = JSON.stringify({ imports: { [key]: url } });
        document.head.appendChild(s);
        await import(key);
        return true;
      } catch (e) {
        console.warn('[GLB Viewer] importmap 探测失败:', e);
        return false;
      }
    }

    const IMPORTMAP_CDNS = [
      {
        name: 'npmmirror(国内)',
        three: 'https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js',
        addons: 'https://registry.npmmirror.com/three/0.160.0/files/examples/jsm/',
        gui: 'https://registry.npmmirror.com/lil-gui/0.20.0/files/dist/lil-gui.esm.min.js'
      },
      {
        name: 'jsdelivr',
        three: 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
        addons: 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/',
        gui: 'https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js'
      },
      {
        name: 'unpkg',
        three: 'https://unpkg.com/three@0.160.0/build/three.module.js',
        addons: 'https://unpkg.com/three@0.160.0/examples/jsm/',
        gui: 'https://unpkg.com/lil-gui@0.20.0/dist/lil-gui.esm.min.js'
      }
    ];

    // 直连路径的 CDN（自带裸导入改写，无需 importmap）
    const DIRECT_CDNS = [
      {
        name: 'jsdelivr(+esm)',
        three: 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
        orbit: 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js/+esm',
        gltf: 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js/+esm',
        gui: 'https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js'
      },
      {
        name: 'esm.sh',
        three: 'https://esm.sh/three@0.160.0/build/three.module.js',
        orbit: 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js',
        gltf: 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js',
        gui: 'https://esm.sh/lil-gui@0.20.0'
      },
      {
        name: 'jspm',
        three: 'https://ga.jspm.io/npm:three@0.160.0/build/three.module.js',
        orbit: 'https://ga.jspm.io/npm:three@0.160.0/examples/jsm/controls/OrbitControls.js',
        gltf: 'https://ga.jspm.io/npm:three@0.160.0/examples/jsm/loaders/GLTFLoader.js',
        gui: 'https://ga.jspm.io/npm:lil-gui@0.20.0/dist/lil-gui.esm.min.js'
      }
    ];

    function injectImportMap(cdn) {
      const s = document.createElement('script');
      s.type = 'importmap';
      s.textContent = JSON.stringify({
        imports: {
          'three': cdn.three,
          'three/addons/': cdn.addons
        }
      });
      document.head.appendChild(s);
    }

    // 加载状态跟踪（诊断"一直转圈"：实时显示当前阶段 + 超时看门狗）
    let loadPhase = '加载 3D 引擎';
    function setPhase(t, d) {
      loadPhase = t + (d ? ' (' + d + ')' : '');
      const ovEl = document.getElementById('overlay');
      const msgEl = ovEl && ovEl.querySelector('.msg');
      if (msgEl && ovEl.style.display !== 'none') {
        msgEl.innerHTML = escapeHtml(loadPhase);
      }
    }

    // 每个 CDN 导入限时 10 秒，超时立即换下一个源（避免网络黑洞卡死页面）
    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' 加载超时')), ms))
      ]);
    }

    // mode: 'importmap' | 'direct'
    async function loadLibs(cdns, mode) {
      for (const cdn of cdns) {
        try {
          setPhase('加载 3D 引擎', cdn.name);
          let THREE, OrbitControls, GLTFLoader, GUI;
          if (mode === 'importmap') {
            injectImportMap(cdn);
            THREE = await withTimeout(import('three'), 10000, cdn.name);
            OrbitControls = (await withTimeout(import('three/addons/controls/OrbitControls.js'), 10000, cdn.name)).OrbitControls;
            GLTFLoader = (await withTimeout(import('three/addons/loaders/GLTFLoader.js'), 10000, cdn.name)).GLTFLoader;
            GUI = (await withTimeout(import(cdn.gui), 10000, cdn.name)).default;
          } else {
            THREE = await withTimeout(import(cdn.three), 10000, cdn.name);
            OrbitControls = (await withTimeout(import(cdn.orbit), 10000, cdn.name)).OrbitControls;
            GLTFLoader = (await withTimeout(import(cdn.gltf), 10000, cdn.name)).GLTFLoader;
            GUI = (await withTimeout(import(cdn.gui), 10000, cdn.name)).default;
          }
          console.log('[GLB Viewer] 使用 CDN:', cdn.name, mode === 'importmap' ? '(importmap)' : '(direct)');
          return { THREE, OrbitControls, GLTFLoader, GUI };
        } catch (e) {
          cdnErrors.push(cdn.name + ': ' + (e && e.message ? e.message : e));
          console.warn('[GLB Viewer] CDN 加载失败: ' + cdn.name, e);
        }
      }
      return null;
    }

    // ---------- 加载顺序：本地依赖优先（秒开），CDN 兜底 ----------
    // 本地依赖 = 与页面同服务器，任何浏览器/微信都能秒开，不受外网 CDN 影响。
    // 首次使用请先运行「下载依赖.bat」（一次性把 three.js 等下载到 lib/ 目录）。
    async function loadLocalLibs() {
      try {
        setPhase('加载 3D 引擎', '本地 lib');
        const THREE = await import('./lib/three.module.js');
        const OrbitControls = (await import('./lib/OrbitControls.js')).OrbitControls;
        const GLTFLoader = (await import('./lib/GLTFLoader.js')).GLTFLoader;
        const GUI = (await import('./lib/lil-gui.esm.min.js')).default;
        console.log('[GLB Viewer] 使用本地依赖（秒开模式）');
        return { THREE, OrbitControls, GLTFLoader, GUI };
      } catch (e) {
        console.warn('[GLB Viewer] 本地 lib/ 依赖不可用（未运行下载依赖.bat？）:', e);
        return null;
      }
    }

    const cdnErrors = [];
    let libs = await loadLocalLibs();
    if (!libs) {
      // CDN 兜底：先 importmap 路径（现代内核），再直连路径（老内核）
      if (await importMapSupported()) {
        libs = await loadLibs(IMPORTMAP_CDNS, 'importmap');
      } else {
        console.warn('[GLB Viewer] 浏览器不支持 importmap，改用直连 URL 加载（兼容老内核）');
      }
    }
    if (!libs) {
      libs = await loadLibs(DIRECT_CDNS, 'direct');
    }

    if (!libs) {
      loadPhase = 'error';
      // 区分"内核太老"与"网络/CDN 问题"
      const specErr = cdnErrors.some(s => /Invalid module specifier|Failed to resolve module specifier|Unexpected identifier|does not provide an export/i.test(s));
      document.getElementById('overlay').innerHTML = specErr
        ? '<div class="msg error">当前浏览器过于老旧，无法加载 three.js（不支持 ES Module）。<br>' +
          '<span class="small">请使用 Chrome / Safari / Edge，或在极速浏览器地址栏切换为「极速模式」。</span></div>'
        : '<div class="msg error">无法加载 three.js / lil-gui 库（所有 CDN 均失败）<br>' +
          '<span class="small">' + cdnErrors.map(escapeHtml).join('<br>') +
          '<br><br>请检查网络后刷新页面。</span></div>';
      throw new Error('All CDNs failed');
    }
    const { THREE, OrbitControls, GLTFLoader, GUI } = libs;

    // 看门狗：25 秒还没加载完成就弹出诊断 + 重试按钮（不再无限转圈）
    setTimeout(() => {
      if (loadPhase !== 'done' && loadPhase !== 'error') {
        const ovEl = document.getElementById('overlay');
        const msgEl = ovEl && ovEl.querySelector('.msg');
        if (msgEl && ovEl.style.display !== 'none') {
          msgEl.innerHTML = '<span style="color:#ffb454">加载超时，可能卡在：' + escapeHtml(loadPhase) + '</span><br>' +
            '<span class="small">请检查网络后点下方重试；若反复超时，可能是某个 CDN 被网络屏蔽，' +
            '可换浏览器、切手机网络，或在电脑上用 Chrome 打开试试。</span><br>' +
            '<button onclick="location.reload()" style="pointer-events:auto;cursor:pointer;margin-top:12px;padding:8px 20px;border:none;border-radius:8px;background:#3d6cff;color:#fff;font-size:14px">重新加载</button>';
        }
      }
    }, 25000);

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // 手机端出错的可见提示（避免一直转圈让人误以为卡住）
    function showFatalError(msg, err) {
      const ov = document.getElementById('overlay');
      if (!ov) return;
      ov.innerHTML = '<div class="msg error">' + msg +
        '<br><span class="small">' + (err && err.message ? escapeHtml(err.message) : '') + '</span></div>';
      ov.style.display = 'flex';
    }

    // ---------- 场景 ----------
    const app = document.getElementById('app');
    const overlay = document.getElementById('overlay');
    const modelNameEl = document.getElementById('model-name');
    const modelLabel = document.getElementById('model-label');

    const scene = new THREE.Scene();
    scene.background = null; // 透明背景，透出 CSS 科技蓝径向渐变

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 2000);
    camera.position.set(4, 3, 6);

    // WebGL 创建失败时先降级（关闭抗锯齿），再失败则给出明确提示（iOS 微信偶发）
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    } catch (e1) {
      try {
        renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
        console.warn('[GLB Viewer] WebGL 降级：关闭抗锯齿');
      } catch (e2) {
        showFatalError('无法创建 WebGL 渲染器：当前浏览器/微信内核不支持 WebGL，请升级微信或用手机系统浏览器打开。', e2);
        throw e2;
      }
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    // ---------- 灯光 ----------
    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(5, 8, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x88aaff, 0.8);
    fill.position.set(-5, 2, -4);
    scene.add(fill);

    // 参考网格
    const grid = new THREE.GridHelper(20, 20, 0x3a4150, 0x232833);
    grid.visible = false;
    scene.add(grid);

    // ---------- 模型管理 ----------
    let modelGroup = null;
    const loader = new GLTFLoader();

    function frameModel() {
      if (!modelGroup) return;
      const box = new THREE.Box3().setFromObject(modelGroup);
      if (box.isEmpty()) return;
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      const dist = sphere.radius / Math.tan((camera.fov * Math.PI) / 360) * 1.2;
      // 自动适配近/远裁剪面（C4D 导出 GLB 默认以厘米为单位，模型可能很大）
      camera.near = Math.max(0.01, sphere.radius * 0.001);
      camera.far = Math.max(2000, dist * 12);
      camera.updateProjectionMatrix();
      const dir = new THREE.Vector3(1, 0.6, 0.9).normalize();
      camera.position.copy(sphere.center).addScaledVector(dir, Math.max(dist, 0.5));
      controls.target.copy(sphere.center);
      controls.minDistance = sphere.radius * 0.05;
      controls.maxDistance = sphere.radius * 30;
      controls.update();
    }

    function applyWireframe(on) {
      if (!modelGroup) return;
      modelGroup.traverse(o => {
        if (o.isMesh && o.material) {
          o.material.wireframe = on;
          o.material.needsUpdate = true;
        }
      });
    }

    // ---------- 模型着色（缓存原色，可恢复） ----------
    let originalColors = null;

    function storeOriginalColors() {
      if (originalColors) return;
      originalColors = [];
      modelGroup.traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => { if (m.color) originalColors.push({ mat: m, color: m.color.getHex() }); });
        }
      });
    }

    function applyModelColor(hex) {
      if (!modelGroup) return;
      modelGroup.traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => { if (m.color) m.color.setHex(hex); });
        }
      });
    }

    function restoreModelColors() {
      if (!originalColors) return;
      originalColors.forEach(({ mat, color }) => { if (mat.color) mat.color.setHex(color); });
    }

    // ---------- 白膜模式（用纯色 PBR 材质覆盖，适合白膜导出预览） ----------
    let clayModeActive = false;
    let backupMaterials = null;

    function enableClayMode() {
      if (!modelGroup || clayModeActive) return;
      clayModeActive = true;
      backupMaterials = [];
      modelGroup.traverse(o => {
        if (o.isMesh) {
          backupMaterials.push({ mesh: o, materials: o.material });
          o.material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(params.modelColor),
            roughness: params.clayRoughness,
            metalness: params.clayMetalness
          });
        }
      });
      applyWireframe(params.wireframe);
      updateClayMaterial();
    }

    function disableClayMode() {
      if (!backupMaterials) return;
      backupMaterials.forEach(({ mesh, materials }) => { mesh.material = materials; });
      backupMaterials = null;
      clayModeActive = false;
      applyWireframe(params.wireframe);
    }

    function updateClayMaterial() {
      if (!clayModeActive || !modelGroup) return;
      modelGroup.traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (m.isMeshStandardMaterial) {
              m.color.set(params.modelColor);
              m.roughness = params.clayRoughness;
              m.metalness = params.clayMetalness;
              m.needsUpdate = true;
            }
          });
        }
      });
    }

    function setModel(object, name) {
      if (modelGroup) {
        scene.remove(modelGroup);
        modelGroup.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(m => m.dispose());
          }
        });
      }
      modelGroup = object;
      originalColors = null; // 新模型，清空原色缓存
      if (clayModeActive) { backupMaterials = null; clayModeActive = false; } // 旧材质备份作废
      scene.add(modelGroup);
      modelNameEl.textContent = name;
      modelLabel.style.display = 'block';
      applyWireframe(params.wireframe); // 保持控制面板中的线框开关状态
      if (params.colorize) { storeOriginalColors(); applyModelColor(params.modelColor); }
      if (params.clayMode) enableClayMode();
      frameModel();
    }

    function showMessage(html, isError) {
      loadPhase = isError ? 'error' : loadPhase;
      overlay.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'msg' + (isError ? ' error' : '');
      div.innerHTML = html;
      overlay.appendChild(div);
      overlay.style.display = 'flex';
    }

    function hideOverlay() {
      loadPhase = 'done';
      overlay.style.display = 'none';
      overlay.innerHTML = '';
    }

    function onModelLoaded(gltf, name) {
      const obj = gltf.scene || gltf.scenes[0];
      setModel(obj, name);
      hideOverlay();
    }

    function onModelError(err, name) {
      console.error(err);
      const detail = err && err.message ? err.message : String(err);
      const isMissing = /404|Failed to fetch|Load failed|not found/i.test(detail);
      showMessage(
        '无法加载 <b>' + escapeHtml(name) + '</b><br>' +
        '<span class="small">' +
        (isMissing
          ? '模型数据不存在。请确认 model.glb 已放到网页所在目录，然后重启服务器。'
          : escapeHtml(detail)) +
        '<br>注意：必须通过本地服务器访问（双击运行 <code>启动.bat</code> 或 <code>启动-分享.bat</code>）。</span>',
        true
      );
    }

    function loadModel(url, name) {
      setPhase('加载模型', name);
      showMessage('正在加载 ' + escapeHtml(name) + ' ...');
      // 优先使用内嵌模型（服务器启动时自动从 model.glb 生成）：
      // 纯内存解析、零网络请求，任何浏览器/微信都不会卡在模型加载上
      if (window.__EMBEDDED_GLB) {
        try {
          const bin = atob(window.__EMBEDDED_GLB);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          loader.parse(bytes.buffer, '', gltf => onModelLoaded(gltf, name), err => onModelError(err, name));
        } catch (e) {
          onModelError(e, name);
        }
        return;
      }
      loader.load(url, gltf => onModelLoaded(gltf, name), undefined, err => onModelError(err, name));
    }

    // 拖拽加载
    let dragDepth = 0;
    window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; app.classList.add('dragging'); });
    window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; app.classList.remove('dragging'); } });
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => {
      e.preventDefault(); dragDepth = 0; app.classList.remove('dragging');
      const file = [...e.dataTransfer.files].find(f => /\.(glb)$/i.test(f.name));
      if (!file) return;
      loadModel(URL.createObjectURL(file), file.name);
    });

    // ---------- 智能获取分享链接 ----------
    // 本地/局域网访问（localhost、127.0.0.1、192.168.x 等）→ 自动替换为公网地址；
    // 公网地址未就绪时返回 null（界面显示"生成中"，绝不返回本地/过期地址）
    function isLocalUrl(url) {
      return /localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|192\.168\.|^https?:\/\/10\.|^https?:\/\/172\.(1[6-9]|2\d|3[01])\./i.test(url);
    }

    function getShareUrl() {
      const current = window.location.href;
      if (isLocalUrl(current)) {
        const pub = window.__LIVE_PUBLIC_URL || window.__SHARE_PUBLIC_URL;
        if (pub && !isLocalUrl(pub) && /^https:\/\//i.test(pub)) return pub;
        return null; // 公网地址未就绪
      }
      return current;
    }

    // 分享：复制链接 + 二维码
    const shareBtn = document.getElementById('share-btn');
    const sharePanel = document.getElementById('share-panel');
    const shareUrl = document.getElementById('share-url');
    const shareNote = document.getElementById('share-note');

    function shareCopyFeedback(ok) {
      const b = document.getElementById('share-copy');
      const old = b.textContent;
      b.textContent = ok ? '✓ 已复制' : '复制失败，请手动选中复制';
      setTimeout(() => { b.textContent = old; }, 1500);
    }

    // 统一二维码渲染：先清空容器 → 新建 canvas → 生成（防止旧二维码残留）
    function clearQR() {
      const wrap = document.getElementById('share-qr-wrap');
      wrap.innerHTML = '';
    }

    function renderQR(url, done) {
      const wrap = document.getElementById('share-qr-wrap');
      wrap.innerHTML = '';
      const canvas = document.createElement('canvas');
      canvas.id = 'share-qr';
      canvas.width = 180;
      canvas.height = 180;
      wrap.appendChild(canvas);
      window.__loadQR(QR => {
        if (QR) {
          try {
            if (typeof QR.toCanvas === 'function') {
              QR.toCanvas(canvas, url, { width: 180, margin: 1, errorCorrectionLevel: 'M' });
            } else if (typeof QR === 'function') {
              // davidshimjs/qrcodejs 风格: new QRCode(容器, { text })
              new QR(canvas, { text: url, width: 180, height: 180 });
            }
            if (done) done(true);
          } catch (e) {
            console.warn('二维码生成失败', e);
            if (done) done(false);
          }
        } else if (done) {
          done(false);
        }
      });
    }

    // 本地环境黄色警告（localhost / 127.0.0.1 时显示）
    function updateShareWarn() {
      const warn = document.getElementById('share-warn');
      if (warn) warn.style.display = isLocalUrl(location.href) ? 'block' : 'none';
    }

    // 刷新分享面板（链接输入框 + 二维码 + 模式提示）
    function refreshSharePanel() {
      updateShareWarn();
      const url = getShareUrl();
      if (!url) {
        // 公网地址未就绪：15 秒内显示"生成中"，超时切换为本地预览模式提示
        shareUrl.value = '';
        shareUrl.placeholder = '公网地址生成中…';
        shareNote.textContent = (Date.now() - shareWaitStart > 15000)
          ? '当前为本地预览模式：请使用 cpolar 或 ngrok 映射端口后刷新，或把链接粘贴到下方输入框手动生成。'
          : '公网隧道尚未就绪（首次启动需 10~30 秒），地址就绪后会自动填入，无需刷新页面。';
        clearQR();
        return;
      }
      shareUrl.value = url;
      shareUrl.placeholder = '';
      shareNote.textContent = isLocalUrl(location.href)
        ? '当前为本地访问，链接已自动替换为公网地址，直接发送即可。'
        : '当前已是公网环境，发送当前链接即可。';
      renderQR(url, ok => {
        if (!ok) shareNote.textContent = '二维码组件加载失败（可能离线），请使用下方手动生成或直接复制链接。';
      });
    }

    function showShareToast(text) {
      let t = document.getElementById('share-toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'share-toast';
        t.style.cssText = 'position:fixed;bottom:64px;right:14px;z-index:40;background:#3d6cff;color:#fff;' +
          'padding:8px 14px;border-radius:8px;font:12px "Segoe UI","Microsoft YaHei",sans-serif;' +
          'box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;';
        document.body.appendChild(t);
      }
      t.textContent = text;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
    }

    // ---------- 分享地址自动更新（无需刷新网页） ----------
    // 每次重新点击「启动.bat」，隧道重启后公网地址会变化；
    // 本页面定时从本地服务器读取最新地址（current-url.txt），自动更新分享链接与二维码。
    // 隧道重启期间（current-url.txt 被清除/404）会立即作废旧地址，避免复制到失效链接。
    window.__LIVE_PUBLIC_URL = null;
    window.__TUNNEL_STATUS = '';
    const shareWaitStart = Date.now();

    function invalidateShareUrl() {
      if (window.__LIVE_PUBLIC_URL || window.__SHARE_PUBLIC_URL) {
        window.__LIVE_PUBLIC_URL = null;
        window.__SHARE_PUBLIC_URL = '';
        console.warn('[GLB Viewer] 公网地址已作废（隧道重启中）');
        if (sharePanel.style.display === 'block') refreshSharePanel();
      }
    }

    // 显示"生成中/本地预览"状态（含隧道诊断信息）
    function showSharePending() {
      if (sharePanel.style.display !== 'block') return;
      if (getShareUrl()) return; // 已有地址，不覆盖
      updateShareWarn();
      let msg;
      if (Date.now() - shareWaitStart > 15000) {
        msg = '当前为本地预览模式：请使用 cpolar 或 ngrok 映射端口后刷新，或把链接粘贴到下方输入框手动生成。';
        if (window.__TUNNEL_STATUS) msg += '（' + window.__TUNNEL_STATUS + '）';
      } else {
        msg = window.__TUNNEL_STATUS
          ? '公网隧道状态：' + window.__TUNNEL_STATUS
          : '公网隧道尚未就绪（首次启动需 10~30 秒）…';
      }
      if (shareNote.textContent !== msg) shareNote.textContent = msg;
    }

    async function pollPublicUrl() {
      // 读取隧道状态说明（share.ps1 写入），用于诊断
      try {
        const s = await fetch('http://127.0.0.1:8000/tunnel-status.txt', { cache: 'no-store' });
        if (s.ok) window.__TUNNEL_STATUS = (await s.text()).trim();
      } catch (e) { /* 忽略 */ }
      try {
        const r = await fetch('http://127.0.0.1:8000/current-url.txt', { cache: 'no-store' });
        if (!r.ok) { invalidateShareUrl(); showSharePending(); return; } // 文件被清除 = 隧道重启中
        const u = (await r.text()).trim();
        if (!u) { invalidateShareUrl(); showSharePending(); return; }
        if (u !== window.__LIVE_PUBLIC_URL) {
          window.__LIVE_PUBLIC_URL = u;
          window.__SHARE_PUBLIC_URL = u; // 动态覆盖为最新公网地址
          console.log('[GLB Viewer] 分享地址自动更新为:', u);
          if (sharePanel.style.display === 'block') refreshSharePanel();
          else showShareToast('分享地址已更新，点「分享」查看新链接');
        }
      } catch (e) {
        showSharePending(); // 本地服务器不可达时也保持提示
      }
    }
    setTimeout(pollPublicUrl, 1500);   // 打开页面后先查一次
    setInterval(pollPublicUrl, 5000);  // 之后每 5 秒检查一次

    shareBtn.addEventListener('click', () => {
      const show = sharePanel.style.display !== 'block';
      sharePanel.style.display = show ? 'block' : 'none';
      if (show) { updateShareWarn(); refreshSharePanel(); }
    });

    // 手动生成二维码（自动获取失败时的备用方案）
    document.getElementById('share-manual-btn').addEventListener('click', () => {
      const manual = document.getElementById('share-manual').value.trim();
      if (!manual) { showShareToast('请先粘贴公网链接'); return; }
      shareUrl.value = manual;
      renderQR(manual, ok => {
        if (ok) {
          showShareToast('已生成二维码');
          shareNote.textContent = '已使用手动输入的链接生成二维码，可直接复制发送。';
        } else {
          showShareToast('二维码生成失败，请检查链接格式');
        }
      });
    });

    document.getElementById('share-copy').addEventListener('click', () => {
      // 优先自动获取的地址；没有则用手动输入框里的链接
      const manual = document.getElementById('share-manual').value.trim();
      const url = getShareUrl() || manual || null;
      if (!url) {
        showShareToast('公网地址尚未就绪，请稍候几秒再复制');
        return; // 不复制本地/无效地址
      }
      shareUrl.value = url;
      shareUrl.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => shareCopyFeedback(true)).catch(() => shareCopyFeedback(ok));
      } else {
        shareCopyFeedback(ok);
      }
    });

    // ---------- lil-gui 控制面板 ----------
    const params = {
      wireframe: false,
      grid: false,
      colorize: false,
      modelColor: '#4da3ff',
      clayMode: false,
      clayRoughness: 0.6,
      clayMetalness: 0.0,
      autoRotate: false,
      autoRotateSpeed: 2,
      fov: camera.fov,
      toneMapping: 'ACESFilmic',
      exposure: renderer.toneMappingExposure,
      background: '#b1cdec',
      resetView: frameModel,
    };

    const gui = new GUI({ title: 'GLB Viewer 控制面板' });

    const viewFolder = gui.addFolder('视图');
    viewFolder.add(params, 'resetView').name('重置视角');
    viewFolder.add(params, 'autoRotate').name('自动旋转').onChange(v => { controls.autoRotate = v; });
    viewFolder.add(params, 'autoRotateSpeed', 0, 10, 0.1).name('旋转速度').onChange(v => { controls.autoRotateSpeed = v; });
    viewFolder.add(params, 'fov', 20, 120, 1).name('视野 FOV').onChange(v => { camera.fov = v; camera.updateProjectionMatrix(); });

    const modelFolder = gui.addFolder('模型');
    modelFolder.add(params, 'wireframe').name('线框').onChange(applyWireframe);
    modelFolder.add(params, 'grid').name('参考网格').onChange(v => { grid.visible = v; });
    modelFolder.add(params, 'colorize').name('模型着色').onChange(v => {
      if (v) { storeOriginalColors(); applyModelColor(params.modelColor); }
      else { restoreModelColors(); }
    });
    modelFolder.addColor(params, 'modelColor').name('模型颜色').onChange(v => {
      if (params.clayMode) { updateClayMaterial(); return; }
      if (params.colorize) applyModelColor(v);
    });
    modelFolder.add(params, 'clayMode').name('白膜模式').onChange(v => {
      if (v) enableClayMode(); else disableClayMode();
    });
    modelFolder.add(params, 'clayRoughness', 0, 1, 0.01).name('白膜粗糙度').onChange(updateClayMaterial);
    modelFolder.add(params, 'clayMetalness', 0, 1, 0.01).name('白膜金属度').onChange(updateClayMaterial);

    const renderFolder = gui.addFolder('渲染');
    renderFolder.add(params, 'toneMapping', ['ACESFilmic', 'Neutral', 'NoToneMapping']).name('色调映射').onChange(v => {
      renderer.toneMapping = v === 'NoToneMapping' ? THREE.NoToneMapping
                          : (v === 'Neutral' ? THREE.NeutralToneMapping : THREE.ACESFilmicToneMapping);
    });
    renderFolder.add(params, 'exposure', 0.2, 3, 0.01).name('曝光').onChange(v => { renderer.toneMappingExposure = v; });
    renderFolder.addColor(params, 'background').name('背景色').onChange(v => { scene.background = new THREE.Color(v); });

    viewFolder.open();
    modelFolder.open();
    renderFolder.open();

    // ---------- 渲染循环 ----------
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- 启动：加载 model.glb ----------
    loadModel('model.glb', 'model.glb');
  </script>
</body>
</html>
